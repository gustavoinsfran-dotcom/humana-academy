<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<link rel="preload" href="fonts/arimo-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bodoni-moda-latin-500-italic.woff2" as="font" type="font/woff2" crossorigin>

<style>
.ac-pre{background:var(--mh-warn-tint);color:var(--mh-warn);border-bottom:1px solid #EAD9AE;font-size:14px}
.ac-pre .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}
.ac-pre b{color:var(--mh-ink)}
.ac-pre .mh-btn{min-height:40px;padding:0 16px;font-size:13.5px}
.ac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.ac-card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--mh-surface);border:1px solid var(--mh-line);border-radius:var(--mh-r-lg);padding:22px;cursor:pointer;font:inherit;color:inherit;min-height:150px;transition:border-color .2s,box-shadow .2s}
.ac-card:hover{border-color:var(--mh-ink);box-shadow:var(--mh-sh-2)}
.ac-card .n{font-family:var(--mh-serif);font-style:italic;font-size:30px;color:var(--mh-accent-ink);line-height:1}
.ac-card .t{font-weight:700;font-size:18px;color:var(--mh-ink)}
.ac-card .d{color:var(--mh-mut);font-size:14.5px;line-height:1.5}
.ac-card .w{margin-top:auto;font-size:12.5px;color:var(--mh-mut);letter-spacing:.04em}
.ac-card[aria-disabled=true]{cursor:not-allowed;background:var(--mh-surface-2)}
.ac-card[aria-disabled=true]:hover{border-color:var(--mh-line);box-shadow:none}
.ac-card.prox{cursor:default;background:var(--mh-surface-2);min-height:0}
.ac-card.prox:hover{border-color:var(--mh-line);box-shadow:none}
.ac-tag{display:inline-block;font:700 11px/1 var(--mh-sans);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--mh-surface-3);color:var(--mh-ink-2);vertical-align:middle}
.ac-tag.ok{background:var(--mh-ok-tint);color:var(--mh-ok)}
.ac-tag.bor{background:var(--mh-warn-tint);color:var(--mh-warn)}
.ac-tag.pil{background:var(--mh-accent-tint);color:var(--mh-accent-ink)}
.ac-tag.nuc{background:var(--mh-ink);color:#fff}
.ac-m0{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;background:var(--mh-ink);color:#fff;border-radius:var(--mh-r-lg);padding:28px 30px;margin:0 0 22px}
.ac-m0 h2{color:#fff;margin:6px 0 6px;font-size:26px}
.ac-m0 p{color:#E4DDE8;margin:0;font-size:15.5px;line-height:1.55}
.ac-m0 .mh-kicker{color:#F2C4DA}
.ac-m0 .mh-btn{background:#fff;color:var(--mh-ink);border-color:#fff}
@media(max-width:700px){.ac-m0{grid-template-columns:1fr;padding:22px}}
.ac-area{margin:0 0 28px}
.ac-area h3{font-size:16px;margin:0 0 12px;color:var(--mh-ink)}
.ac-area .ac-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ac-area .ac-card{min-height:0;padding:16px 18px;border-radius:var(--mh-r)}
.ac-area .ac-card .t{font-size:15.5px}
.mh .content table{width:100%;border-collapse:collapse;margin:8px 0 24px;font-size:15.5px;line-height:1.5}
.mh .content th,.mh .content td{border-bottom:1px solid var(--mh-line);padding:10px 12px 10px 0;text-align:left;vertical-align:top;color:var(--mh-ink-2)}
.mh .content th{color:var(--mh-ink);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.ac-tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ac-sec{border-top:1px solid var(--mh-line);padding-top:26px;margin-top:30px}
.ac-sec:first-child{border-top:0;padding-top:0;margin-top:0}
.ac-sec>h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ac-filtro{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px}
.ac-filtro button,.ac-tabs button{min-height:44px;border:1.5px solid var(--mh-line-2);background:#fff;border-radius:999px;padding:0 16px;font:700 14px/1 var(--mh-sans);color:var(--mh-ink-2);cursor:pointer}
.ac-filtro button[aria-pressed=true],.ac-tabs button[aria-selected=true]{background:var(--mh-ink);border-color:var(--mh-ink);color:#fff}
.ac-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}
.ac-ver{background:var(--mh-accent-tint);border-radius:var(--mh-r-lg);padding:22px 24px;margin:0 0 30px}
.ac-ver .mh-kicker{color:var(--mh-accent-ink)}
.ac-ver h2{margin:6px 0 10px;font-size:22px}
.ac-gob{background:var(--mh-surface);border:1px solid var(--mh-line);border-radius:var(--mh-r);padding:18px 20px;margin:34px 0 0;font-size:14px;color:var(--mh-mut);line-height:1.6}
.ac-gob dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:10px 0 0}
.ac-gob dt{font-weight:700;color:var(--mh-ink-2)}
.ac-gob dd{margin:0}
.ac-refl{background:var(--mh-surface);border:1px solid var(--mh-line);border-radius:var(--mh-r);padding:20px 22px;margin:28px 0}
.ac-refl ul{margin:10px 0 0;padding-left:22px}
.ac-refl li{margin:0 0 8px;color:var(--mh-ink-2);font-size:16.5px;line-height:1.6}
.ac-sim{background:var(--mh-blue-tint);border-radius:var(--mh-r);padding:18px 20px;margin:0 0 20px;color:var(--mh-ink-2);font-size:16px;line-height:1.65}
.ac-crit{display:none;background:var(--mh-err-tint);color:var(--mh-err);border-radius:12px;padding:14px 16px;margin:14px 0 0;font-size:15px;line-height:1.55}
.ac-crit.show{display:block}
.ac-vacio{background:var(--mh-surface-2);border-radius:var(--mh-r);padding:18px 20px;color:var(--mh-mut);font-size:15px;line-height:1.6}
.ac-lista{list-style:none;padding:0;margin:0}
.ac-lista li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:14px 0;border-bottom:1px solid var(--mh-line)}
.ac-lista li:last-child{border-bottom:0}
.ac-lista .n{font-family:var(--mh-serif);font-style:italic;color:var(--mh-accent-ink);font-size:22px}
.ac-lista b{display:block;color:var(--mh-ink)}
.ac-lista span{color:var(--mh-mut);font-size:14.5px;line-height:1.5}
.ac-lista button{all:unset;cursor:pointer;display:block}
.ac-lista button:focus-visible{outline:2px solid var(--mh-accent);outline-offset:3px;border-radius:6px}
.ac-lista button b{text-decoration:underline;text-decoration-color:var(--mh-line-2);text-underline-offset:3px}
</style>
</head>
<body class="mh">
<a class="mh-skip" href="#app">Ir al contenido</a>
<header class="top"><div class="wrap">
<button class="brand" onclick="home()" aria-label="Humana Academy, ir al inicio de la nueva Academy"><span class="mh-word"><b>Humana</b> <span>Academy</span></span><span class="sep" aria-hidden="true"></span><span class="mh-logo" aria-hidden="true"><i>m</i>étodo<b>Humana</b></span></button>
<nav class="desk" aria-label="Principal"><div class="userbox" id="userbox"></div><a class="home" href="index.html">Inicio</a></nav>
</div></header>
<div id="pre"></div>
<main id="app" tabindex="-1"></main>
<div class="fbgate" id="fbgate" role="status" aria-live="polite"></div>
<div class="mh-toast toast" id="toast" role="status" aria-live="polite"></div>
<footer class="pie"><div class="wrap">
<div><span class="mh-logo"><i>m</i>étodo<b>Humana</b></span><small>Humana Academy · Humana Health &amp; Care · Humana, desde 2011</small></div>
<nav aria-label="Pie"><a href="#" onclick="home();return false">Nueva Academy</a><a href="index.html">Volver al inicio</a><a href="#" id="paisbtn" onclick="cambiarPais();return false">Ver versión España</a></nav>
</div></footer>

<script src="pais.js?v=1"></script>
<script src="academia-estructura.js?v=1"></script>
<script src="contenido.js?v=3"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const A=HA_AC, P=HA_PAIS, esc=A.esc, pad=A.pad;
const LOGO='<span class="mh-logo"><i>m</i>étodo<b>Humana</b></span>';
const IAR='<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 8h9M8.5 4.5L12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const IBK='<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13 8H4M7.5 4.5L4 8l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ADMINS=['gustavo.insfran@infinitypharma.com.ar','k.ojanguren@humanahc.com'];
const app=document.getElementById('app');

/* ---------- estado ---------- */
let curUser=null, db=null, auth=null;
let U={name:'', escuela:'', rol:'equipo'};     // del documento del usuario
let PROG={ok:{}, scores:{}};                   // users/{uid}.academia
let RAW=[], DOCS={};                           // contenido de la base
let EDITORA=false, VISTA_ALUMNA=false;          // vista previa de borradores
let ESC_VER='';                                 // escuela que se está mirando (editoras pueden cambiarla)

function toast(m){const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2800);}
function L(x){ return P.L(x); }
function visible(d){ return d && d.estado!=='archivado' && (d.estado==='publicado' || (EDITORA && !VISTA_ALUMNA)); }
function doc(id){ const d=DOCS[id]; return visible(d)?d:null; }
function lista(f){ return RAW.filter(d=>visible(d)&&f(d)).sort((a,b)=>(a.orden||0)-(b.orden||0)); }
function escuelaActual(){ return ESC_VER || U.escuela || ''; }
function m0ok(){ return !!PROG.ok['modulo-0']; }
function bloqueado(n){ return n>0 && !m0ok() && !(EDITORA && !VISTA_ALUMNA); }
function estadoTag(d){ if(!d) return ''; if(d.estado==='borrador') return ' <span class="ac-tag bor">Borrador</span>'; return ''; }
function foco(){ window.scrollTo(0,0); const h=app.querySelector('h1'); if(h){ h.setAttribute('tabindex','-1'); h.focus({preventScroll:true}); } }
function tablas(html){ return (html||'').replace(/<table>/g,'<div class="ac-tablewrap"><table>').replace(/<\/table>/g,'</table></div>'); }
function html(x){ return tablas(A.sanear(L(x))); }

/* ---------- capa por país ---------- */
function aplicarPais(){ P.fijar(curUser&&curUser.email); const pb=document.getElementById('paisbtn'); if(pb) pb.textContent=P.boton(); }
function cambiarPais(){ P.cambiar(); aplicarPais(); rehacer(); toast(P.T('Versión España','Versión Argentina')); }
let rehacer=home;

/* ---------- barra de vista previa ---------- */
function pintarPre(){
  const b=document.getElementById('pre'); if(!b) return;
  if(!EDITORA){ b.innerHTML=''; return; }
  const nb=RAW.filter(d=>d.estado==='borrador').length, np=RAW.filter(d=>d.estado==='publicado').length;
  b.innerHTML='<div class="ac-pre" role="region" aria-label="Vista previa"><div class="wrap"><span>'+(VISTA_ALUMNA?'<b>Viendo como alumna:</b> solo lo publicado.':'<b>Vista previa de editora.</b> Ves '+nb+' '+(nb===1?'borrador':'borradores')+' y '+np+' '+(np===1?'publicado':'publicados')+'.')+'</span>'
   +'<span style="display:flex;gap:8px;flex-wrap:wrap"><button class="mh-btn sec" onclick="alternarVista()">'+(VISTA_ALUMNA?'Ver borradores':'Ver como alumna')+'</button><a class="mh-btn ghost" href="estudio-academia.html">Estudio</a></span></div></div>';
}
function alternarVista(){ VISTA_ALUMNA=!VISTA_ALUMNA; pintarPre(); home(); }

function renderUserbox(){
  const b=document.getElementById('userbox'); if(!b) return;
  const e=A.escuela(U.escuela);
  b.innerHTML=(U.name?'<span class="hi">'+esc(U.name.split(' ')[0])+'</span>':'')+(e?'<span class="ac-tag" title="Tu escuela">'+esc(e.t)+'</span>':'');
}

/* ---------- inicio ---------- */
function home(){
  rehacer=home; renderUserbox();
  const e=A.escuela(U.escuela);
  const hayAlgo=RAW.some(visible);
  if(!hayAlgo){
    app.innerHTML=`<section class="phero"><div class="wrap"><span class="mh-kicker">Nueva Academy</span><h1>En <b>preparación</b></h1>
     <p class="lead">La Dirección Médica está validando los contenidos. Mientras tanto, seguí con tus recorridos en el inicio.</p>
     <div class="acts"><a class="mh-btn pa" href="index.html">Ir al inicio</a></div></div></section>`;
    foco(); return;
  }
  const m0=doc('modulo-0');
  const m0card=`<div class="ac-m0"><div><span class="mh-kicker">Módulo 0 · Obligatorio</span><h2>Doctrina Humana</h2>
    <p>${m0ok()?'Completado. Podés volver cuando quieras: el resto es de consulta.':'Empezá por acá. El núcleo se lee en 15 minutos y abre el resto de la Academy.'}</p></div>
    <button class="mh-btn" onclick="abrir('modulo-0')" ${m0?'':'disabled'}>${m0ok()?'Repasar':'Empezar'} <span class="ar">${IAR}</span></button></div>`;
  const cards=A.MODULOS.filter(m=>m.n>0).map(m=>{
    const lock=bloqueado(m.n);
    return `<button type="button" class="ac-card" onclick="${lock?'avisoM0()':'verModulo('+m.n+')'}" ${lock?'aria-disabled="true"':''}>
      <span class="n" aria-hidden="true">${m.n}</span><span class="t">${esc(m.t)}</span><span class="d">${esc(m.d)}</span>
      <span class="w">${lock?'Se abre al completar el Módulo 0':esc(m.para)}</span></button>`;
  }).join('');
  app.innerHTML=`<section class="phero"><div class="wrap grid2"><div>
    <span class="mh-kicker">Humana Academy</span><h1>Una misma doctrina, <b>seis escuelas</b></h1>
    <p class="lead">Nueve troncos comunes y una escuela por perfil. Cambian el lenguaje, la profundidad y las competencias. Compartir el itinerario no significa compartir atribuciones clínicas.</p></div>
    <aside class="next" aria-label="Tu escuela"><span class="mh-kicker">Tu escuela</span><h2>${e?esc(e.t):'Sin asignar'}</h2>
     <p>${e?esc(e.eje):'La asigna la administración. Mientras tanto ves el Módulo 0 y el tronco común.'}</p>
     ${e&&!bloqueado(2)?`<button class="mh-btn pa" onclick="abrir('escuela-${e.id}')">Ir a mi escuela <span class="ar">${IAR}</span></button>`:''}</aside>
   </div></section>
   <section class="blk"><div class="wrap">${m0card}<div class="ac-grid">${cards}</div></div></section>`;
  foco();
}
function avisoM0(){ toast('Primero completá el Módulo 0: Doctrina Humana'); }

/* ---------- módulos ---------- */
function cabeza(kicker,t,lead,volver){
  return `<section class="mhead"><div class="wrap"><button class="back" onclick="${volver||'home()'}">${IBK} ${volver?'Volver':'Nueva Academy'}</button>
   <div class="kk"><span class="mh-kicker">${kicker}</span></div><h1>${t}</h1>${lead?`<p class="lead">${lead}</p>`:''}</div></section>`;
}
function verModulo(n){
  if(bloqueado(n)){ avisoM0(); return; }
  rehacer=()=>verModulo(n);
  const m=A.MODULOS[n]; let cuerpo='';
  if(n===1){
    const intro=doc('programa-integral');
    const es=escuelaActual();
    cuerpo=(intro?`<p><button class="mh-btn sec" onclick="abrir('programa-integral')">Leer el programa integral${estadoTag(intro)}</button></p>`:'')
     +'<div class="ac-grid" style="margin-top:22px">'+A.TRONCOS.map(t=>{
       const d=doc(t.id); if(!d) return `<div class="ac-card prox"><span class="n" aria-hidden="true">${pad(t.n)}</span><span class="t">${esc(t.t)}</span><span class="d">${esc(t.sub)}</span><span class="w">Próximamente</span></div>`;
       const v=es&&d.versiones&&d.versiones[es];
       return `<button type="button" class="ac-card" onclick="abrir('${t.id}')"><span class="n" aria-hidden="true">${pad(t.n)}</span><span class="t">${esc(L(d.t))}${estadoTag(d)}</span><span class="d">${esc(L(d.sub))}</span><span class="w">${esc(L(v?v.lead:d.lead))}</span>${PROG.ok[t.id]?'<span class="ac-tag ok">Completado</span>':''}</button>`;
     }).join('')+'</div>';
  } else if(n===2){
    const mias=EDITORA&&!VISTA_ALUMNA?A.ESCUELAS:A.ESCUELAS.filter(e=>e.id===U.escuela);
    cuerpo=(!U.escuela&&!(EDITORA&&!VISTA_ALUMNA))?'<div class="ac-vacio">Todavía no tenés escuela asignada. La asigna la administración. Mientras tanto, completá el Módulo 0 y el tronco común.</div>':'';
    cuerpo+='<div class="ac-grid">'+mias.map(e=>{ const d=doc('escuela-'+e.id);
      return d?`<button type="button" class="ac-card" onclick="abrir('escuela-${e.id}')"><span class="t">${esc(e.t)}${estadoTag(d)}</span><span class="d">${esc(e.eje)}</span><span class="w">${lista(x=>x.tipo==='unidad'&&x.escuela===e.id).length} unidades</span></button>`
              :`<div class="ac-card prox"><span class="t">${esc(e.t)}</span><span class="d">${esc(e.eje)}</span><span class="w">Próximamente</span></div>`; }).join('')+'</div>';
  } else if(n===3){
    const intro=doc('programa-enfermedades');
    cuerpo=(intro?`<p><button class="mh-btn sec" onclick="abrir('programa-enfermedades')">Leer el programa por enfermedades${estadoTag(intro)}</button></p>`:'')
     +'<p style="color:var(--mh-mut);margin:16px 0 26px">Orden de desarrollo: insuficiencia cardíaca, EPOC, demencias, diabetes y fragilidad. Las demás se suman cuando la Dirección Médica valide su ficha.</p>'
     +A.AREAS.map(a=>`<div class="ac-area"><h3>${esc(a.t)}</h3><div class="ac-grid">${a.mods.map(m=>{ const d=doc(m.id);
        return d?`<button type="button" class="ac-card" onclick="abrir('${m.id}')"><span class="t">${esc(m.t)}${estadoTag(d)}</span>${d.piloto?'<span><span class="ac-tag pil">Piloto</span></span>':''}${PROG.ok[m.id]?'<span><span class="ac-tag ok">Completado</span></span>':''}</button>`
                :`<div class="ac-card prox"><span class="t">${esc(m.t)}</span><span class="w">Próximamente</span></div>`; }).join('')}</div></div>`).join('');
  } else {
    const ds=lista(d=>d.modulo===n);
    cuerpo=ds.length?'<div class="ac-grid">'+ds.map(d=>`<button type="button" class="ac-card" onclick="abrir('${d.id}')"><span class="t">${esc(L(d.t))}${estadoTag(d)}</span><span class="d">${esc(L(d.sub||''))}</span></button>`).join('')+'</div>'
      :'<div class="ac-vacio">Próximamente.</div>';
    if(n===5){ const ic=doc('patologia-insuficiencia-cardiaca'); if(ic) cuerpo+=`<p style="margin-top:22px"><button class="mh-btn sec" onclick="abrir('patologia-insuficiencia-cardiaca')">Evaluación del piloto: insuficiencia cardíaca</button></p>`; }
  }
  app.innerHTML=cabeza('Módulo '+n+' · '+esc(m.para), esc(m.t), esc(m.d))+`<section class="blk"><div class="wrap">${cuerpo}</div></section>`;
  foco();
}

/* ---------- documento ---------- */
let curDoc=null, answers={}, corregido=false, filtroDoc='todo';
function abrir(id){
  const d=doc(id); if(!d){ toast('Ese contenido todavía no está disponible'); return; }
  if(d.modulo>0 && bloqueado(d.modulo)){ avisoM0(); return; }
  curDoc=d; filtroDoc='todo'; rehacer=()=>abrir(id); pintarDoc(); foco();
}
function cambiarEsc(id){ ESC_VER=id; pintarDoc(); const b=document.getElementById('tab_'+id); if(b) b.focus(); }
function filtrar(f){ filtroDoc=f; pintarDoc(); const b=document.getElementById('f_'+f); if(b) b.focus(); }

function seccionesHTML(secs,conFiltro){
  return (secs||[]).filter(s=>!conFiltro||filtroDoc==='todo'||s.parte===filtroDoc||(filtroDoc==='nucleo'&&s.parte==='intro'))
   .map(s=>`<section class="ac-sec" id="s_${esc(s.id)}"><h2>${esc(L(s.t))}${s.parte==='nucleo'?' <span class="ac-tag nuc">Núcleo</span>':''}</h2>${html(s.body)}</section>`).join('');
}
function gobHTML(g){
  if(!g) return '';
  const f=[['Autor',g.autor],['Revisión clínica',g.revisor||'Pendiente de validación'],['Versión',g.version],['Fecha',g.fecha],['Próxima revisión',g.proximaRevision],['Referencias',g.referencias]].filter(x=>x[1]);
  return `<aside class="ac-gob" aria-label="Ficha de gobernanza"><span class="mh-kicker">Ficha de gobernanza</span><dl>${f.map(x=>`<dt>${x[0]}</dt><dd>${esc(L(x[1]))}</dd>`).join('')}</dl></aside>`;
}
function videoHTML(d){
  if(d.video && window.HA_incrustar){ const v=HA_incrustar('video',d.video); if(v) return `<div class="vid">${v.html}</div>`; }
  return (EDITORA&&!VISTA_ALUMNA)?'<div class="ac-vacio" style="margin:0 0 26px">Lugar para el video de esta unidad. Lo carga la editora desde el Estudio.</div>':'';
}

function pintarDoc(){
  const d=curDoc, es=escuelaActual();
  const tieneVers=d.versiones&&Object.keys(d.versiones).length;
  const v=A.version(d,es);
  const volver=d.tipo==='unidad'?`abrir('escuela-${d.escuela}')`:`verModulo(${d.modulo})`;
  const mod=A.MODULOS[d.modulo];
  let cuerpo='';

  // Pestañas de escuela: las editoras pueden ver las seis versiones.
  if(tieneVers && EDITORA && !VISTA_ALUMNA){
    cuerpo+='<div class="ac-tabs" role="tablist" aria-label="Versión por escuela">'+A.ESCUELAS.map(e=>`<button type="button" role="tab" id="tab_${e.id}" aria-selected="${es===e.id}" onclick="cambiarEsc('${e.id}')">${esc(e.t)}</button>`).join('')+'</div>';
  }
  if(d.tipo==='doctrina'){
    cuerpo+='<div class="ac-filtro" role="group" aria-label="Qué leer">'+[['todo','Todo'],['nucleo','El núcleo · 15 minutos'],['consulta','De consulta']].map(f=>`<button type="button" id="f_${f[0]}" aria-pressed="${filtroDoc===f[0]}" onclick="filtrar('${f[0]}')">${f[1]}</button>`).join('')+'</div>';
  }
  cuerpo+=videoHTML(d);

  // Versión de la escuela de la persona, antes del contenido común.
  if(tieneVers){
    const e=A.escuela(es);
    if(e && (v.lead||v.secciones.length)){
      cuerpo+=`<div class="ac-ver"><span class="mh-kicker">Para ${esc(e.t)}</span>${(v.titulo||v.lead)?`<h2>${esc(L(v.titulo||v.lead))}</h2>`:''}${v.titulo&&v.lead?`<p>${esc(L(v.lead))}</p>`:''}<div class="content">${seccionesHTML(v.secciones)}</div></div>`;
    } else if(!e){
      cuerpo+='<div class="ac-vacio" style="margin:0 0 26px">Cuando la administración te asigne una escuela, acá vas a ver la versión para tu perfil.</div>';
    }
  }
  if(d.tipo==='tronco'){
    cuerpo+='<h2 style="font-size:20px;margin:0 0 12px">Cómo se adapta a cada perfil</h2><ul class="ac-lista">'+A.ESCUELAS.map(e=>{ const x=d.versiones&&d.versiones[e.id]; return x?`<li><span class="n" aria-hidden="true">·</span><div><b>${esc(e.t)}</b><span>${esc(L(x.lead))}</span></div></li>`:''; }).join('')+'</ul>';
  }
  cuerpo+=`<article class="content">${seccionesHTML(d.secciones,d.tipo==='doctrina')}</article>`;

  if(d.tipo==='escuela') cuerpo+=escuelaHTML(d);
  if(v.reflexion&&v.reflexion.length) cuerpo+=`<section class="ac-refl" aria-labelledby="rf"><span class="mh-kicker" id="rf">Preguntas para pensar</span><ul>${v.reflexion.map(q=>`<li>${esc(L(q))}</li>`).join('')}</ul></section>`;
  cuerpo+=evaluacionHTML(d,v);
  cuerpo+=gobHTML(d.gobernanza);

  const kicker=(d.tipo==='unidad'?(A.escuela(d.escuela)||{}).t+' · Unidad '+d.n:'Módulo '+d.modulo+' · '+mod.t);
  const titulo=esc(L(d.t))+estadoTag(d);
  app.innerHTML=cabeza(esc(kicker),titulo,esc(L(d.sub?d.sub:d.lead||'')),volver)+`<div class="wrap"><div class="reading">${cuerpo}</div></div>`;
  if(document.getElementById('quiz')) pintarQuiz(A.items(v));
}

function escuelaHTML(d){
  const id=d.escuela, uns=lista(x=>x.tipo==='unidad'&&x.escuela===id);
  let h='<section class="ac-sec" style="margin-top:34px;padding-top:26px;border-top:1px solid var(--mh-line)"><h2 style="font-size:24px">Unidades</h2>';
  h+=uns.length?'<ul class="ac-lista">'+uns.map(u=>`<li><span class="n" aria-hidden="true">${pad(u.n)}</span><button type="button" onclick="abrir('${u.id}')"><b>${esc(L(u.t))}${estadoTag(u)}</b><span>${esc(L(u.lead))}</span>${PROG.ok[u.id]?' <span class="ac-tag ok">Completada</span>':''}</button></li>`).join('')+'</ul>'
     :'<div class="ac-vacio">Las unidades de esta escuela están en preparación. Mientras tanto, esta es la versión del tronco común y del piloto para este perfil.</div>';
  h+='</section>';
  h+='<section class="ac-sec" style="margin-top:34px;padding-top:26px;border-top:1px solid var(--mh-line)"><h2 style="font-size:24px">Los nueve troncos para este perfil</h2><ul class="ac-lista">'
    +A.TRONCOS.map(t=>{ const x=doc(t.id); const v=x&&x.versiones&&x.versiones[id]; return v?`<li><span class="n" aria-hidden="true">${pad(t.n)}</span><button type="button" onclick="abrir('${t.id}')"><b>${esc(t.t)}</b><span>${esc(L(v.lead))}</span></button></li>`:''; }).join('')+'</ul></section>';
  const ic=doc('patologia-insuficiencia-cardiaca');
  if(ic&&ic.versiones&&ic.versiones[id]) h+=`<p style="margin-top:22px"><button class="mh-btn sec" onclick="ESC_VER='${id}';abrir('patologia-insuficiencia-cardiaca')">Piloto: insuficiencia cardíaca para este perfil</button></p>`;
  return h;
}

/* ---------- evaluación: preguntas, simulación y errores críticos ---------- */
function evaluacionHTML(d,v){
  const items=A.items(v);
  const completar=(d.id==='modulo-0'&&!items.length);
  if(completar){
    return `<section class="sec2" aria-labelledby="cmp"><h2 class="mh-kicker" id="cmp">Módulo 0</h2><div class="quiz"><p class="qi">${m0ok()?'Ya completaste el Módulo 0.':'Cuando termines de leer el núcleo, marcalo como leído. Se abre el resto de la Academy.'}</p>
      <div class="qa"><button class="mh-btn pa" onclick="marcarLeido('modulo-0')" ${m0ok()?'disabled':''}>Leí el núcleo de la Doctrina</button></div></div></section>`;
  }
  if(!items.length){
    return (EDITORA&&!VISTA_ALUMNA)?'<div class="ac-vacio" style="margin-top:28px">Evaluación pendiente: cinco preguntas de conocimiento y una simulación del caso. La escribe la Dirección Médica en el Estudio.</div>':'';
  }
  const sim=v.simulacion&&v.simulacion.caso?`<div class="ac-sim"><b>Simulación del caso.</b> ${esc(L(v.simulacion.caso))}</div>`:'';
  return `<section class="sec2" aria-labelledby="qz"><h2 class="mh-kicker" id="qz">Evaluación</h2><div class="quiz">
    <p class="qi">${items.length} preguntas · se aprueba con ${d.umbral||60}% o más y sin errores críticos de seguridad.</p>${sim}<div id="quiz"></div>
    <div class="qa"><button class="mh-btn pa" id="btnCorr" onclick="corregir()">Corregir</button><button class="mh-btn sec" onclick="abrir('${d.id}')">Reintentar</button></div>
    <div class="score" id="score" role="status" aria-live="polite"></div><div class="ac-crit" id="crit" role="alert"></div></div></section>`;
}
let ITEMS=[];
function pintarQuiz(items){
  ITEMS=items; answers={}; corregido=false;
  let simAbierta=false;
  document.getElementById('quiz').innerHTML=items.map((q,qi)=>{
    let pre=''; if(q.sim&&!simAbierta){ simAbierta=true; pre='<p class="mh-kicker" style="margin:26px 0 10px">Simulación · qué hacés en cada paso</p>'; }
    return pre+`<fieldset class="q" style="border:0;padding-left:0;padding-right:0;min-width:0"><legend class="qt" id="qt_${qi}"><span class="n">${qi+1}.</span><span>${esc(L(q.q))}</span></legend>
     <div class="opts" role="radiogroup" aria-labelledby="qt_${qi}">${q.o.map((o,oi)=>`<button type="button" class="opt" role="radio" aria-checked="false" id="o_${qi}_${oi}" onclick="elegir(${qi},${oi})"><span class="dot" aria-hidden="true"></span><span>${esc(L(o))}</span></button>`).join('')}</div>
     <div class="exp" id="e_${qi}">${q.e?esc(L(q.e)):''}</div></fieldset>`;
  }).join('');
}
function elegir(qi,oi){ if(corregido) return; answers[qi]=oi; ITEMS[qi].o.forEach((_,i)=>{ const e=document.getElementById('o_'+qi+'_'+i); if(e){ e.classList.toggle('sel',i===oi); e.setAttribute('aria-checked',i===oi?'true':'false'); } }); }
function corregir(){
  if(corregido) return;
  if(Object.keys(answers).length<ITEMS.length){ toast('Respondé todas las preguntas'); return; }
  corregido=true;
  const r=A.corregir(ITEMS,answers,curDoc.umbral);
  ITEMS.forEach((q,qi)=>{ q.o.forEach((_,oi)=>{ const el=document.getElementById('o_'+qi+'_'+oi); el.classList.remove('sel'); el.setAttribute('aria-disabled','true'); if(oi===q.c) el.classList.add('correct'); else if(answers[qi]===oi) el.classList.add('wrong'); }); const x=document.getElementById('e_'+qi); if(x) x.classList.add('show'); });
  const s=document.getElementById('score'); s.classList.add('show'); s.classList.toggle('ok',r.aprobado);
  s.textContent='Nota: '+r.nota+'% · '+(r.aprobado?'Aprobada.':'No aprobada.');
  const c=document.getElementById('crit');
  if(r.criticos.length){ c.classList.add('show'); c.innerHTML='<b>Error crítico de seguridad</b> en '+(r.criticos.length===1?'la pregunta ':'las preguntas ')+r.criticos.map(i=>i+1).join(', ')+'. Aunque la nota alcance, no se aprueba. Repasá el circuito de urgencias y los límites de tu perfil.'; }
  guardar(curDoc.id,r.nota,r.aprobado);
}
function marcarLeido(id){ guardar(id,100,true); toast('Módulo 0 completado. Ya podés seguir con el resto.'); pintarDoc(); }
function guardar(id,nota,aprobado){
  const prev=PROG.scores[id];
  if(prev==null||nota>prev) PROG.scores[id]=nota;
  if(aprobado) PROG.ok[id]=true;
  if(!curUser||!db) return;
  db.collection('users').doc(curUser.uid).set({academia:{scores:PROG.scores, ok:PROG.ok, updatedAt:firebase.firestore.FieldValue.serverTimestamp()}},{merge:true}).catch(function(){});
}

/* ---------- Firebase ---------- */
const firebaseConfig={apiKey:"AIzaSyAuFD2_AQOhOJDp92GFEreOc_8Si39ki2o",authDomain:"humana-academy.firebaseapp.com",projectId:"humana-academy",storageBucket:"humana-academy.firebasestorage.app",messagingSenderId:"516938011921",appId:"1:516938011921:web:09feb7c8677faf7c77a8b0"};
const gate=document.getElementById('fbgate');
function cargando(){ gate.innerHTML='<div class="box">'+LOGO+'<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><p>Cargando tu sesión</p><span class="mh-kicker">Nueva Academy</span></div>'; gate.classList.add('on'); }
function cargarUsuario(user){
  return db.collection('users').doc(user.uid).get().then(function(s){
    const d=s.exists?s.data():{};
    U.name=d.name||''; U.escuela=d.escuela||''; U.rol=d.rol||'equipo';
    const a=d.academia||{}; PROG={ok:a.ok||{}, scores:a.scores||{}};
  }).catch(function(){});
}
/* El material validado vive en academia-contenido.json y se ve aunque nadie lo haya traído a la base.
   Lo que está en Firestore (editado en el Estudio) reemplaza a su versión del archivo. */
function cargarBase(){ return fetch('academia-contenido.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{docs:[]}).then(j=>j.docs||[]).catch(()=>[]); }
function leerAcademia(q){ return q.get().then(function(qs){ const a=[]; qs.forEach(function(s){ const x=s.data(); x.id=s.id; a.push(x); }); return a; }).catch(function(e){ console.warn('No se pudo leer la Academy', e&&e.code); return []; }); }
function cargarContenido(){
  const col=db.collection('academia');
  const qs=EDITORA?[leerAcademia(col)]:[leerAcademia(col.where('estado','==','publicado')), leerAcademia(col.where('base','==',true))];
  return Promise.all([cargarBase()].concat(qs)).then(function(r){
    DOCS={}; r.forEach(function(a){ a.forEach(function(d){ DOCS[d.id]=d; }); }); RAW=Object.values(DOCS);
  });
}
try{
  firebase.initializeApp(firebaseConfig); auth=firebase.auth(); db=firebase.firestore();
  try{auth.languageCode='es';}catch(e){}
  try{auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);}catch(e){}
  auth.onAuthStateChanged(function(user){
    curUser=user;
    if(!user){ location.replace('index.html?volver='+encodeURIComponent('academia.html')); return; }
    EDITORA=ADMINS.indexOf((user.email||'').toLowerCase())>=0;
    try{ localStorage.setItem('ha_email',JSON.stringify(user.email||'')); }catch(e){}
    Promise.all([cargarUsuario(user),cargarContenido()]).then(function(){ aplicarPais(); pintarPre(); gate.classList.remove('on'); home(); });
  });
  cargando();
}catch(e){ console.warn(e); }
</script>
