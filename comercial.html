{n:1,t:"Qué aporta Humana",lead:"Lo que tenés que poder explicar en dos minutos a una prepaga, una obra social o una institución.",
 body:`<h2>La idea</h2><p>Humana concentra en un solo operador la gestión y el seguimiento de la atención en domicilio de <strong>pacientes crónicos complejos</strong>: pluripatológicos, frágiles y con alto uso de recursos.</p><p>Alrededor de cada paciente arma una estructura organizada y continua: un <strong>equipo de referencia</strong> que conoce su historia, sigue su evolución, detecta cambios y responde en su casa.</p>
 <div class="quote">Acercamos la capacidad de respuesta sanitaria a la puerta de su casa.</div>
 <h2>Los cuatro problemas que ayudamos a ordenar</h2>
 <ul><li><strong>Fragmentación:</strong> muchos profesionales e intervenciones, sin una coordinación clínica integrada.</li>
 <li><strong>Guardias repetidas:</strong> consultas a la guardia por situaciones que, en algunos casos, se pueden valorar y resolver en domicilio.</li>
 <li><strong>Internaciones y reinternaciones:</strong> episodios que se pueden prevenir o abordar antes cuando hay seguimiento continuo.</li>
 <li><strong>Estadías prolongadas:</strong> pacientes estabilizados que pueden seguir su recuperación en casa, con una estructura adecuada.</li></ul>
 <h2>Qué nos diferencia</h2><p>Una visita médica, una curación o una internación domiciliaria son intervenciones concretas. Humana es quien <strong>organiza, integra y da continuidad</strong> a esas intervenciones.</p><p>Con el seguimiento detectamos cambios, valoramos su importancia y activamos una respuesta proporcionada, antes de la próxima complicación.</p>
 <h2>A qué pacientes atendemos</h2><p>Pacientes crónicos complejos, en general mayores, con varias patologías, internaciones repetidas, consultas frecuentes a la guardia y tratamientos que necesitan coordinación.</p><p>La edad es frecuente, pero no es el criterio. Lo que define es la <strong>complejidad clínica</strong> y la necesidad de continuidad. Pasa mucho con pacientes que viven lejos de los grandes centros, para quienes la guardia termina siendo la única respuesta que conocen.</p>
 <h2>Para llevarte</h2><p>Humana trabaja junto al hospital y respeta las internaciones necesarias. Busca que cada paciente reciba la atención que necesita, en el momento oportuno y en el lugar más adecuado. Lo que ofrecemos es una forma distinta de organizar la atención de los pacientes que más continuidad necesitan.</p>`,
 quiz:[{q:"¿Qué hace Humana, en una frase?",o:["Hace visitas médicas sueltas","Concentra la gestión y el seguimiento en domicilio de pacientes crónicos complejos","Reemplaza al hospital","Vende internación domiciliaria por día"],c:1,e:"Un solo operador que organiza y sigue la atención en casa del paciente complejo."},{q:"¿Cuál de estos es uno de los problemas que ayudamos a ordenar?",o:["La fragmentación de la atención","El precio de los medicamentos","La publicidad de la prepaga","Los trámites de afiliación"],c:0,e:"Fragmentación, guardias repetidas, internaciones y estadías prolongadas."},{q:"Frente a la internación domiciliaria o las visitas que el financiador ya tiene, Humana…",o:["Las reemplaza a todas","Organiza, integra y da continuidad a esas intervenciones","Solo hace curaciones","Compite por precio"],c:1,e:"La diferencia está en cómo se organiza y se sostiene la atención."},{q:"¿Qué define si un paciente es para Humana?",o:["Tener más de 80 años","La complejidad clínica y la necesidad de continuidad","Vivir en la ciudad","Tener prepaga"],c:1,e:"La edad es frecuente, pero lo que define es la complejidad."},{q:"¿Humana busca evitar todas las internaciones?",o:["Sí, siempre","No: busca que cada paciente reciba la atención adecuada en el lugar adecuado","Solo las de urgencia","Depende del precio"],c:1,e:"Hay internaciones necesarias. El foco es el recurso más adecuado en cada momento."}]},

{n:2,t:"Las preguntas difíciles",lead:"Seis preguntas que te van a hacer seguro, cómo responderlas y qué preguntar vos.",
 body:`<h2>La idea</h2><p>En cada reunión aparecen las mismas preguntas. Acá están las respuestas de Humana y, para cada una, la pregunta que conviene hacer vos para entender la necesidad del otro lado.</p>
 <h2>1. «Ya tenemos internación domiciliaria y visitas. ¿Qué tienen de distinto?»</h2><p>Humana gestiona la atención en domicilio como un <strong>proceso continuo</strong>. Las visitas, la enfermería o la internación forman parte de un plan organizado alrededor del paciente.</p><p>Si preguntan si reemplazamos a sus prestadores: podemos asumir de forma integrada algunas prestaciones y el seguimiento de una población definida, según el acuerdo y la capacidad operativa. La idea es ordenar la atención de quienes necesitan gestión continua.</p><p><strong>Tu pregunta:</strong> «¿Quién hace hoy el seguimiento de un paciente complejo entre una prestación y la siguiente?»</p>
 <h2>2. «¿Para qué una plataforma si ya tenemos historia clínica?»</h2><p>La tecnología de Humana convive con sus sistemas. Sirve para organizar la atención, registrar lo que se hace, seguir la evolución, detectar cambios y coordinar al equipo, con trazabilidad.</p><p>Estamos desarrollando un agente de inteligencia artificial que apoye al equipo, siempre con supervisión profesional. Presentalo como lo que es: algo en desarrollo.</p><p>Si piden acceso a la información: se pueden acordar informes con indicadores y actividad, según el contrato y la Ley 25.326 de protección de datos.</p><p><strong>Tu pregunta:</strong> «¿Qué información les gustaría recibir periódicamente para seguir a los pacientes?»</p>
 <h2>3. «¿Qué garantía tenemos de ahorrar?»</h2><p>Humana no promete cifras. Propone medir. Estamos desarrollando <strong>Impacta Humana</strong>, una herramienta para comparar la inversión en nuestro modelo con la evolución del gasto: guardias, internaciones, reinternaciones, días de estadía, episodios resueltos en domicilio y costos.</p><p>Si preguntan si podemos demostrar una internación evitada: se documenta con criterios clínicos definidos. Y para hablar de ahorro hace falta una comparación válida y costos de referencia acordados.</p><p><strong>Tu pregunta:</strong> «¿Tienen datos de uso y costos de estos pacientes para armar una referencia inicial?»</p>
 <h2>4. «Si el paciente termina internado igual, ¿qué aportan?»</h2><p>Hay situaciones que necesitan hospital, como una fractura de cadera que requiere cirugía. Humana trabaja en dos momentos: detectar y tratar a tiempo lo que se puede resolver en casa, y sostener el regreso después del alta, con un equipo que el paciente y su familia ya conocen.</p><p>Sobre las estadías: podemos ayudar a identificar pacientes estabilizados que pueden seguir en casa, si las condiciones lo permiten. Cuánto se reduce se evalúa en cada caso.</p><p><strong>Tu pregunta:</strong> «¿Tienen pacientes que siguen internados porque no hay una estructura para continuar en casa?»</p>
 <h2>5. «¿Cuál es la tarifa?»</h2><p>El precio se construye según la población, la complejidad y la intensidad de atención. Buscamos un precio pactado, sostenible para Humana y defendible para quien contrata. Se mira la inversión global, no el costo de una visita.</p><p>Si quieren empezar con pocos pacientes: se puede plantear un piloto con población definida, criterios de inclusión, prestaciones, duración e indicadores.</p><p><strong>Tu pregunta:</strong> «¿Con qué grupo de pacientes les interesaría empezar y qué resultados necesitarían para ampliar?»</p>
 <h2>6. «¿Atienden solo a personas mayores? ¿Llegan lejos?»</h2><p>Lo que define es la complejidad clínica, no la edad. Para pacientes que viven lejos de los grandes centros, el modelo es especialmente útil. Se estudia con una organización territorial adecuada, verificando antes recursos, tiempos de respuesta y seguridad.</p><p><strong>Tu pregunta:</strong> «¿Tienen identificados pacientes complejos en zonas alejadas que usen mucho la guardia?»</p>
 <h2>Para llevarte</h2><p>No alcanza con explicar bien Humana. Se trata de escuchar, identificar una necesidad, reconocer nuestros límites operativos y proponer una colaboración viable.</p>`,
 quiz:[{q:"Si te preguntan si Humana garantiza un ahorro, respondés que…",o:["Sí, un porcentaje fijo","No prometemos cifras: proponemos medirlo con información verificable","El costo no importa","Depende del laboratorio"],c:1,e:"El ahorro se mide y se demuestra; no se promete."},{q:"Impacta Humana hoy es…",o:["Una herramienta terminada","Una herramienta en desarrollo para comparar inversión y gasto","Una prepaga","Un sistema de facturación"],c:1,e:"Se presenta como lo que es: algo en desarrollo."},{q:"Si piden la tarifa en la primera reunión…",o:["Das un precio por visita","Explicás que se construye según población, complejidad e intensidad, y proponés un piloto","Te negás a hablar de plata","Ofrecés el precio más bajo"],c:1,e:"Primero entender la población; el precio se pacta después."},{q:"Sobre el acceso a la información de los pacientes…",o:["Se comparte todo, sin límites","Se acuerdan informes según el contrato y la protección de datos","Nunca se comparte nada","Se manda por WhatsApp"],c:1,e:"Indicadores y actividad, dentro del contrato y de la Ley 25.326."},{q:"Después de cada respuesta, conviene…",o:["Seguir hablando de Humana","Hacer una pregunta para entender la necesidad del otro lado","Cerrar el contrato","Mandar la presentación"],c:1,e:"Cada respuesta abre una pregunta que te acerca a la necesidad real."}]},

{n:3,t:"Cómo llevar una reunión",lead:"Una primera reunión de media hora, paso a paso: de la preparación al próximo paso acordado.",
 body:`<h2>La idea</h2><p>En una primera reunión no se venden prestaciones sueltas ni se cierra un contrato. El objetivo es <strong>identificar una población de pacientes</strong> donde Humana pueda aportar valor y <strong>acordar un próximo paso concreto</strong>.</p>
 <h2>Antes de ir</h2><ul><li>Cómo está organizado el financiador o la institución en la zona.</li><li>Con qué clínicas y sanatorios trabaja.</li><li>Qué servicios domiciliarios tiene contratados, si se sabe.</li><li>Quiénes son los responsables médicos, de prestaciones y de auditoría.</li><li>Qué necesidades podría tener con pacientes crónicos complejos, altas y uso de internación.</li></ul><p>No des por supuesto el problema. Andá preparado para descubrirlo.</p>
 <h2>Apertura · 5 minutos</h2><div class="quote">Gracias por recibirnos. Les cuento brevemente qué hace Humana, pero sobre todo me interesa conocer cómo gestionan hoy a sus pacientes crónicos complejos y qué dificultades encuentran.</div><p>El objetivo es abrir una conversación profesional y que el otro empiece a contar su realidad. Conviene evitar arrancar enumerando servicios, pasando tarifas o hablando de ahorro.</p>
 <h2>Exploración · 12 minutos</h2><p>Es la parte más importante. Cinco preguntas guía:</p><ol><li>¿Cómo gestionan hoy a los pacientes crónicos complejos que usan mucho la internación?</li><li>¿Dónde encuentran más dificultades: guardias repetidas, reinternaciones, estadías largas o la continuidad después del alta?</li><li>Cuando uno de estos pacientes se descompensa en su casa, ¿qué respuesta tiene antes de ir a la guardia?</li><li>¿Tienen dificultades con pacientes que viven lejos de los grandes centros?</li><li>Si pudieran mejorar una sola cosa en la atención de estos pacientes en los próximos meses, ¿cuál sería?</li></ol>
 <h2>Profundizar</h2><p>No se trata de hacer cinco preguntas seguidas. Escuchá y repreguntá cuando aparece algo concreto:</p><p><em>«Tenemos muchos pacientes mayores que vuelven a la guardia.»</em> → «¿Tienen identificados los perfiles que más vuelven?» → <em>«Sobre todo cardíacos y respiratorios.»</em> → «¿Hay algún seguimiento entre una guardia y la siguiente, o el paciente vuelve cuando se descompensa?»</p>
 <h2>Presentación de Humana · 8 minutos</h2><p>Con la necesidad sobre la mesa, la vinculás con el modelo. Contá solo lo que responde al problema que apareció en la charla.</p>
 <h2>Lo económico</h2><p>El modelo económico se construye juntos: primero la población, su complejidad y la intensidad que necesita; después un precio sostenible para ambas partes. Conviene evitar:</p><ul><li>Dar un precio sin conocer las necesidades.</li><li>Prometer porcentajes de ahorro.</li><li>Decir que todas las internaciones son evitables.</li><li>Comprometer cobertura o tiempos de respuesta sin verificar la capacidad operativa.</li></ul>
 <h2>Cierre · 5 minutos</h2><div class="quote">Por lo que hablamos, tendría sentido empezar analizando un grupo de pacientes con estas características. ¿Les parece identificar una población inicial y armar una reunión de trabajo con los responsables?</div><p>Buenos resultados de una primera reunión: una segunda reunión con dirección médica o auditoría, una población identificada, perfiles clínicos para revisar, un circuito de derivación o un piloto delimitado.</p><p>Nunca comprometas acceso a datos clínicos identificables sin una base legal y un procedimiento autorizado.</p>
 <h2>Después de la reunión</h2><ol><li>¿Qué necesidad concreta identifiqué?</li><li>¿Qué pacientes están involucrados?</li><li>¿Cómo se atienden hoy?</li><li>¿Qué podría aportar Humana?</li><li>¿Qué información necesito para una propuesta?</li><li>¿Qué compromisos todavía no tengo que asumir?</li><li>¿Qué próximo paso acordamos?</li></ol>
 <h2>Para llevarte</h2><p>Una buena reunión es la que permite entender una necesidad real, ver dónde puede intervenir Humana y acordar un próximo paso.</p>`,
 quiz:[{q:"El objetivo de una primera reunión es…",o:["Cerrar el contrato","Identificar una población donde Humana aporte valor y acordar un próximo paso","Presentar todas las prestaciones","Pasar la tarifa"],c:1,e:"Entender la necesidad y salir con un próximo paso."},{q:"¿Cuál es la parte más importante de la reunión?",o:["La apertura","La exploración: preguntar y escuchar","La presentación","El cierre"],c:1,e:"Doce minutos para entender la realidad del otro."},{q:"En la apertura conviene evitar…",o:["Agradecer","Arrancar enumerando servicios o hablando de tarifas","Presentarse","Preguntar"],c:1,e:"Primero la conversación; los servicios y la plata, después."},{q:"En la presentación de Humana…",o:["Contás todo lo que hacemos","Contás lo que responde al problema que apareció en la charla","Mostrás precios","Hablás de la competencia"],c:1,e:"Solo lo que conecta con la necesidad identificada."},{q:"Una reunión termina bien cuando…",o:["Mandás la presentación por mail","Hay un próximo paso concreto acordado","Te piden presupuesto","Dura más de una hora"],c:1,e:"El cierre siempre propone una continuidad concreta."}]},

{n:4,t:"Estudiar a un financiador o una institución",lead:"Qué averiguar antes de ir y cómo ordenar la oportunidad en una ficha.",
 body:`<h2>La idea</h2><p>Estudiar a un financiador no es saber cuántos afiliados tiene. Es entender <strong>cómo usa sus recursos</strong>, qué pacientes necesitan una gestión más organizada y si Humana puede dar una respuesta sostenible.</p>
 <h2>Qué averiguar</h2><ol>
 <li><strong>Identificación:</strong> nombre, tipo (prepaga, obra social, institución u otro), grupo al que pertenece, afiliados en total y en la zona, planes y cómo viene en el mercado.</li>
 <li><strong>Población:</strong> edades (más de 65, 75 y 85), crónicos y pluripatológicos, alta complejidad, reinternaciones, uso frecuente de guardia, dependencia y dónde viven.</li>
 <li><strong>Red:</strong> clínicas y sanatorios propios y contratados, centros y especialistas, guardias, prestadores domiciliarios, enfermería, internación domiciliaria, programas de crónicos y cómo se coordina la internación con el domicilio.</li>
 <li><strong>Uso y costos</strong> (si hay información): consultas a guardia, internaciones, reinternaciones a 30 y 90 días, estadía media, diagnósticos de mayor uso, costos medios y gasto por afiliado. Separá los costos potencialmente evitables de los ahorros demostrados.</li>
 <li><strong>Gestión clínica:</strong> si tiene programas de cronicidad, si estratifica por riesgo, si sigue a los pacientes después del alta, quién coordina y cómo detecta una descompensación en casa.</li>
 <li><strong>Contratación:</strong> por prestación, por módulo, por cápita, por paciente y mes o por objetivos; autorizaciones, auditoría, facturación y plazos de pago.</li>
 <li><strong>Capacidad de pago:</strong> situación económica, historial de pago a prestadores y riesgo de cobranza. En Argentina conviene mirar especialmente el tipo de financiador, la cadena de contratación y las condiciones reales de cobro.</li>
 <li><strong>Interlocutores:</strong> dirección médica, prestaciones, auditoría médica, dirección regional, finanzas, contratación de prestadores y programas de crónicos. De cada uno: nombre, cargo, capacidad de decisión, contacto y estado de la relación.</li></ol>
 <h2>La oportunidad para Humana</h2><p>Con lo que averiguaste, se define: <strong>población</strong> objetivo, <strong>necesidad</strong> concreta, <strong>intervención</strong> de Humana, <strong>territorio</strong> que podemos cubrir, <strong>modelo económico</strong> e <strong>indicadores</strong> para medir.</p>
 <ul><li><strong>Prioridad alta:</strong> necesidad concreta, población identificable, interlocutor adecuado y viabilidad asistencial y económica.</li><li><strong>Prioridad media:</strong> hay interés, pero falta información o validación.</li><li><strong>Prioridad baja:</strong> no hay una necesidad identificada o la colaboración no es viable.</li></ul>
 <p>Riesgos a mirar: pocos pacientes, dispersión territorial con costos altos, tarifas que no cubren la intensidad de atención, interlocutor sin capacidad de decisión, trabas de autorización o facturación, riesgo de falta de pago y exigencias que Humana no pueda asumir.</p>
 <h2>Cómo marcar cada dato</h2><ul><li><strong>Confirmado:</strong> respaldado por una fuente verificable o por documentación de la entidad.</li><li><strong>Estimado:</strong> calculado con supuestos explícitos.</li><li><strong>Pendiente:</strong> información que hay que pedir o comprobar.</li></ul>
 <div class="quote">Una hipótesis comercial y una necesidad demostrada son cosas distintas.</div>

 <h2>Para llevarte</h2><p>Estudiamos a un financiador para entender cómo usa sus recursos y si Humana puede ofrecer una respuesta asistencial y económicamente sostenible.</p>`,
