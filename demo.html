<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Humana Academy · Recorrido</title>
<link rel="canonical" href="https://academy.humanahc.com.ar/demo.html">
<meta name="theme-color" content="#FBF9FA">
<link rel="icon" href="mark.svg">
<link rel="stylesheet" href="metodo.css?v=1">
<link rel="stylesheet" href="metodo-pistas.css?v=1">
<style>
body.mh{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:12px}
.dwrap{width:100%;max-width:1240px}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.dbrand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dbrand .mh-word{font-size:19px}
.dbrand .sep{width:1px;height:22px;background:var(--mh-line-2)}
.dbrand .mh-kicker{font-size:11.5px}
.ctl{display:flex;gap:8px}
.stage{position:relative;border-radius:var(--mh-r-lg);overflow:hidden;background:var(--mh-bg);border:1px solid var(--mh-line);box-shadow:var(--mh-sh-2)}
.bar{position:absolute;top:0;left:0;height:2px;background:var(--mh-accent);width:0;z-index:9}
.fr{width:100%;height:min(64vh,620px);border:0;display:block;background:var(--mh-bg)}
.load{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:var(--mh-bg);z-index:6;transition:opacity .4s}
.load.off{opacity:0;pointer-events:none}
.load .mh-logo{font-size:28px}
.load span.t{color:var(--mh-mut);font-size:14px}
.nar{position:absolute;left:20px;bottom:20px;right:20px;z-index:7;pointer-events:none;display:flex}
.nar .in{max-width:640px;background:var(--mh-ink);color:#fff;border-radius:20px;padding:20px 24px;box-shadow:var(--mh-sh-2);opacity:0;transform:translateY(10px);animation:din .5s var(--mh-ease) forwards}
.nar .k{font-family:var(--mh-serif);font-style:italic;font-weight:500;color:#E7A9C6;font-size:18px;line-height:1;margin-bottom:8px}
.nar .t{font-size:clamp(17px,1.7vw,21px);font-weight:700;letter-spacing:-.015em;margin-bottom:6px;line-height:1.3}
.nar .s{font-size:clamp(14px,1.3vw,15.5px);color:#CFC6D3;line-height:1.55}
.nar b{color:#fff}
@keyframes din{to{opacity:1;transform:none}}
.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}
.dots i{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.dots i:before{content:"";width:6px;height:6px;border-radius:3px;background:var(--mh-line-2);transition:.25s var(--mh-ease)}
.dots i.on:before{background:var(--mh-accent);width:22px}
.pie{text-align:center;color:var(--mh-mut);font-size:13px;margin-top:8px;line-height:1.6}
.aviso{background:var(--mh-warn-tint);border:1px solid #F0DDB0;color:#4A3300;border-radius:14px;padding:13px 16px;font-size:14px;line-height:1.55;margin-bottom:12px;display:none}
.aviso.on{display:block}
.aviso a{color:var(--mh-warn);font-weight:700}
@media(max-width:640px){.fr{height:58vh}.nar{left:10px;right:10px;bottom:10px}.nar .in{padding:14px 16px;border-radius:16px}.dbrand .sep,.dbrand .mh-kicker{display:none}.ctl{width:100%}.ctl .mh-btn{flex:1}}
</style></head><body class="mh">
<div class="dwrap">
 <div class="dtop"><div class="dbrand">
  <span class="mh-word"><b>Humana</b> <span>Academy</span></span><span class="sep" aria-hidden="true"></span><span class="mh-kicker">Recorrido de la plataforma</span></div>
  <div class="ctl"><button class="mh-btn sec sm" id="pp">Pausar</button><button class="mh-btn ghost sm" id="rs">Volver al inicio</button></div></div>
 <div class="aviso" id="aviso" role="status"></div>
 <div class="stage"><div class="bar" id="bar"></div>
  <div class="load" id="load"><span class="mh-logo"><i>m</i>étodo<b>Humana</b></span><span class="t">Cargando la plataforma…</span></div>
  <iframe class="fr" id="fr" title="Humana Academy"></iframe>
  <div class="nar" id="nar" aria-live="polite"></div></div>
 <div class="dots" id="dots"></div>
 <div class="pie">Esto es la plataforma real, en vivo, no una maqueta. · academy.humanahc.com.ar<br>Flechas izquierda y derecha para moverte · barra espaciadora para pausar</div>
</div>
<script>
var E=[
 {u:'index.html', y:[0,0], t:'Tu entorno, no una grilla para todos',
  s:'Al entrar, cada persona ve <b>su</b> estado: qué hizo, qué le queda y un solo botón grande que dice por dónde seguir.'},
 {u:'index.html', y:[0,520], t:'Tres recorridos, un mismo entorno',
  s:'Academy, Nexo y Cutaquig en un solo lugar. Cada persona ve <b>su avance</b> en cada ruta y sabe exactamente qué le falta.'},
 {u:'index.html', y:[520,1250], t:'Logros y el programa completo',
  s:'Los módulos de doctrina, una idea por módulo, más el caso integrador de Doña Elena. <b>Cada módulo cierra con autoevaluación.</b>'},
 {u:'cutaquig.html', y:[0,0], t:'Cutaquig®: la capacitación crítica',
  s:'Medicamento de <b>venta bajo receta</b>. El cartel regulatorio está siempre arriba: uso interno, exclusivo para médicos y enfermeros, contenido validado por Asuntos Regulatorios.'},
 {u:'cutaquig.html', y:[0,900], t:'Nueve módulos, cero margen de error',
  s:'Desde qué es una inmunoglobulina hasta farmacovigilancia. <b>El módulo 3 va en rojo</b>: la maltosa interfiere con los glucómetros y es el error más fácil de cometer.'},
 {u:'calculadora.html', y:[0,560], t:'Calculadora de dosis',
  s:'El enfermero pone peso y dosis prescrita. <b>70 kg × 0,10 → 7,00 g · 42,00 mL.</b> Coincide exacto con el ejemplo del laboratorio.'},
 {u:'calculadora.html', y:[560,1250], t:'Viales reales, disponibilidad argentina',
  s:'En Argentina solo se comercializan los de <b>2 g y 4 g</b>. La herramienta sugiere la combinación y avisa el sobrante a desechar. <b>La dosis la prescribe el médico</b>: esto solo convierte.'},
 {u:'index.html', y:[0,0], adm:true, t:'Quién está aprendiendo',
  s:'Solo lo ven Gustavo y Karina: cada persona, su avance en las tres rutas y las acciones para ordenar las cuentas. <b>Los contenidos se editan desde el Estudio</b>, sin tocar código.'}
];
var DUR=8000;
var i=0,t=null,pausado=false,ini=0,resto=0;
var fr=document.getElementById('fr'),bar=document.getElementById('bar'),nar=document.getElementById('nar'),
    load=document.getElementById('load'),dots=document.getElementById('dots'),aviso=document.getElementById('aviso');
E.forEach(function(){ dots.appendChild(document.createElement('i')); });
var ds=[].slice.call(dots.children);
ds.forEach(function(d,k){ d.setAttribute('role','button'); d.setAttribute('tabindex','0'); d.setAttribute('aria-label','Escena '+(k+1)); d.onclick=function(){ ir(k); }; });

function narrar(e){
  nar.innerHTML='<div class="in"><div class="k">'+String(i+1).padStart(2,'0')+' / '+String(E.length).padStart(2,'0')+'</div><div class="t">'+e.t+'</div><div class="s">'+e.s+'</div></div>';
}
function scrollSuave(win,de,a,ms){
  try{ win.scrollTo(0,de); }catch(err){ return; }
  if(de===a) return;
  var t0=null;
  function paso(ts){ if(!t0)t0=ts; var p=Math.min((ts-t0)/ms,1);
    var v=de+(a-de)*(p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2);
    try{ win.scrollTo(0,v); }catch(err){ return; }
    if(p<1) requestAnimationFrame(paso); }
  setTimeout(function(){ requestAnimationFrame(paso); },1100);
}
function cerrarPops(w){
  // El pop de bienvenida aparece con retardo: hay que taparlo durante unos segundos, no una sola vez.
  var t0=Date.now();
  (function limpiar(){
    try{ w.document.querySelectorAll('#mpop.on,.pop.on,#onb.show').forEach(function(p){ p.classList.remove('on','show'); }); }catch(e){}
    if(Date.now()-t0 < 6000) setTimeout(limpiar, 250);
  })();
}
function abrirAdmin(w){
  // Pedir el panel UNA sola vez, cuando la sesion del iframe ya resolvio.
  // (Llamarlo en loop dispara una consulta a la base por intento y traba la pestania.)
  var t0=Date.now(), pedido=false;
  (function esperar(){
    var listo=false;
    try{ listo = !!(w.firebase && w.firebase.auth && w.firebase.auth().currentUser); }catch(e){}
    if(listo && !pedido){
      pedido=true;
      try{ if(typeof w.showAdmin==='function') w.showAdmin(); }catch(e){}
      return;
    }
    if(Date.now()-t0 < 7000) setTimeout(esperar, 350);
  })();
}
function pintar(n){
  var e=E[n];
  ds.forEach(function(d,k){ d.classList.toggle('on',k===n); });
  narrar(e);
  load.classList.remove('off');
  // Si la escena anterior abrio el panel de admin, hay que recargar aunque sea la misma pagina.
  var mismo = fr.getAttribute('data-u')===e.u && fr.getAttribute('data-adm')!=='1' && !e.adm;
  function listo(){
    load.classList.add('off');
    var w=null; try{ w=fr.contentWindow; }catch(err){}
    if(!w) return;
    try{
      cerrarPops(w);
      if(e.adm){ abrirAdmin(w); }
      if(e.u==='calculadora.html' && w.document.getElementById('peso')){
        w.document.getElementById('peso').value='70';
        w.document.getElementById('dosis').value='0.10';
        if(typeof w.calcular==='function'){ w.calcular(); }
        if(typeof w.sugerir==='function'){ w.sugerir(); }
      }
    }catch(err){}
    scrollSuave(w, e.y[0], e.y[1], (+E[n].dur||DUR)-1800);
  }
  if(mismo && !e.adm){ setTimeout(listo,120); }
  else { fr.setAttribute('data-u',e.u); fr.setAttribute('data-adm', e.adm?'1':'0'); fr.onload=function(){ setTimeout(listo, e.adm?2200:1500); }; fr.src=e.u+'?demo=1&t='+Date.now(); }
}
function correr(ms){
  ini=Date.now(); resto=ms;
  bar.style.transition='none'; bar.style.width='0'; void bar.offsetWidth;
  bar.style.transition='width '+ms+'ms linear'; bar.style.width='100%';
  t=setTimeout(function(){ ir((i+1)%E.length); }, ms);
}
function ir(n){ clearTimeout(t); i=n; pintar(i); if(!pausado) correr(DUR); }
document.getElementById('pp').onclick=function(){
  pausado=!pausado;
  if(pausado){ clearTimeout(t); resto=resto-(Date.now()-ini);
    var w=getComputedStyle(bar).width; bar.style.transition='none'; bar.style.width=w; this.textContent='Seguir'; }
  else { this.textContent='Pausar'; correr(Math.max(resto,900)); }
};
document.getElementById('rs').onclick=function(){ pausado=false; document.getElementById('pp').textContent='Pausar'; ir(0); };
document.addEventListener('keydown',function(ev){
  if(ev.key==='ArrowRight') ir((i+1)%E.length);
  if(ev.key==='ArrowLeft') ir((i-1+E.length)%E.length);
  if(ev.key===' '){ ev.preventDefault(); document.getElementById('pp').click(); }
});
setTimeout(function(){
  try{ var w=fr.contentWindow; if(w && w.document && w.document.querySelector('.fbgate.on')){
    aviso.innerHTML='<b>Entrá primero a la plataforma</b> para que el recorrido muestre tu entorno: abrí <a href="index.html" >academy.humanahc.com.ar</a>, iniciá sesión, y volvé a esta página.';
    aviso.classList.add('on'); } }catch(e){}
},6000);
ir(0);
</script></body></html>
