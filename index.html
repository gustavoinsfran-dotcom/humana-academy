<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humana Academy · Formación en Medicina de Continuidad</title>
<meta name="description" content="Humana Academy — programa de formación en Medicina de Continuidad. Humana Health & Care · Argentina.">
<meta name="theme-color" content="#0C0713">
<meta property="og:title" content="Humana Academy">
<meta property="og:description" content="Formación en Medicina de Continuidad · Humana Health & Care Argentina">
<meta property="og:image" content="og.png">
<meta property="og:type" content="website">
<meta name="robots" content="noindex, nofollow">
<meta property="og:url" content="https://academy.humanahc.com.ar/">
<link rel="canonical" href="https://academy.humanahc.com.ar/">
<link rel="icon" href="mark.svg">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0713;--bg2:#140C1F;--card:#191024;--card2:#1E1430;--line:#2C1F42;--tx:#EDE6F5;--mut:#9E90B5;--g1:#4733A6;--g2:#EC2E8E;--pink:#F0328C;--purple:#8E2E9E;--ok:#39d98a;--grad:linear-gradient(135deg,#4733A6 0%,#8E2E9E 50%,#EC2E8E 100%)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* header */
header.top{position:sticky;top:0;z-index:50;background:rgba(12,7,19,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:66px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.brand .mk{width:38px;height:24px;flex-shrink:0}
.brand .wm{font-weight:800;font-size:18px;letter-spacing:.2px}
.brand .wm b{font-weight:800}
nav.desk{display:flex;gap:26px;font-size:14px;color:var(--mut)}
nav.desk a{cursor:pointer;text-decoration:none;transition:.15s}
nav.desk a:hover{color:var(--pink)}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px}
.burger span{width:24px;height:2px;background:var(--tx);border-radius:2px;transition:.25s}
.burger.x span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger.x span:nth-child(2){opacity:0}
.burger.x span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.drawer{display:none;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--line)}
.drawer.open{display:flex}
.drawer a{padding:15px 22px;border-top:1px solid var(--line);color:var(--tx);text-decoration:none;font-weight:600;font-size:15px}
/* hero */
.hero{position:relative;overflow:hidden;padding:92px 0 96px;text-align:center}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0}
.b1{width:460px;height:460px;background:radial-gradient(circle,#5A2FB0,transparent 70%);top:-120px;left:-80px;animation:float1 14s ease-in-out infinite}
.b2{width:420px;height:420px;background:radial-gradient(circle,#EC2E8E,transparent 70%);bottom:-140px;right:-60px;animation:float2 16s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,-30px)}}
.hero .in{position:relative;z-index:1}
.hero .bigmk{width:96px;height:60px;margin:0 auto 8px;display:block;filter:drop-shadow(0 10px 30px rgba(236,46,142,.35))}
.hero .k{font-size:12.5px;letter-spacing:4px;text-transform:uppercase;color:var(--mut);font-weight:600}
.hero h1{font-size:60px;line-height:1.02;margin:10px 0 16px;font-weight:900;letter-spacing:-1px}
.hero p{font-size:18px;color:#cfc3e0;max-width:56ch;line-height:1.6;margin:0 auto 30px}
.cta{display:inline-block;background:var(--grad);color:#fff;font-weight:700;padding:15px 32px;border-radius:12px;text-decoration:none;font-size:15.5px;cursor:pointer;box-shadow:0 10px 30px rgba(236,46,142,.28);transition:.18s}
.cta:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(236,46,142,.4)}
/* sections */
section.blk{padding:60px 0}
.eyebrow{font-weight:700;font-size:12.5px;letter-spacing:2px;text-transform:uppercase}
h2.sec{font-size:32px;margin:8px 0 8px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--mut);font-size:15.5px;max-width:62ch;line-height:1.6;margin:0 0 30px}
.reveal{opacity:0;transform:translateY(22px);transition:.6s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.prog{display:flex;align-items:center;gap:12px;margin:0 0 24px;font-size:13px;color:var(--mut)}
.userbox{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.userbox .hi{color:var(--tx);font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userbox .mini{display:flex;align-items:center;gap:7px}
.userbox .mbar{width:66px;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.userbox .mbar i{display:block;height:100%;background:var(--grad);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.onb .field{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--card2);color:var(--tx);font-size:15px;margin:8px 0 0;font-family:inherit}
.onb .field:focus{outline:none;border-color:var(--pink)}
.onb .err{color:#ff6b9d;font-size:12.5px;min-height:17px;margin:5px 0 2px;text-align:left}
.bar{flex:1;height:8px;background:#241834;border-radius:8px;overflow:hidden;max-width:300px}
.bar>i{display:block;height:100%;background:var(--grad);width:0;transition:.5s}
.certcta{background:var(--grad);border-radius:18px;padding:24px 28px;margin:0 0 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:0 14px 40px rgba(236,46,142,.25)}
.certcta b{font-size:18px}.certcta small{color:#f3dcec;font-size:13px}
.certcta button{background:#fff;color:#3a1a52;border:none;font-weight:700;padding:12px 24px;border-radius:10px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.mcard:before{content:"";position:absolute;inset:0;background:var(--grad);opacity:0;transition:.2s;z-index:0}
.mcard:hover{transform:translateY(-5px);border-color:transparent;box-shadow:0 20px 44px rgba(0,0,0,.45)}
.mcard:hover:before{opacity:.10}
.mcard>*{position:relative;z-index:1}
.mcard .num{width:46px;height:46px;border-radius:13px;background:var(--grad);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 8px 20px rgba(236,46,142,.3)}
.mcard h3{font-size:18px;margin:16px 0 8px;line-height:1.25;font-weight:700}
.mcard p{font-size:13.5px;color:var(--mut);line-height:1.55;margin:0 0 12px}
.mcard .go{font-size:13px;font-weight:700}
.mcard .best{font-size:12px;color:var(--ok);font-weight:700;margin-bottom:10px}
.mcard .done{position:absolute;top:22px;right:22px;color:var(--ok);font-size:18px;display:none;z-index:2}
.mcard.v .done{display:block}
.mcard.cap{border-style:dashed}
.mcard.cap .num{background:linear-gradient(135deg,#8E2E9E,#EC2E8E)}
/* module view */
.mhero{position:relative;overflow:hidden;padding:52px 0 46px;border-bottom:1px solid var(--line)}
.mhero .blob{opacity:.4}
.back{color:var(--tx);font-size:13.5px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;font-weight:700;background:var(--card2);border:1px solid var(--line);padding:10px 18px;border-radius:11px;transition:.15s}.back:hover{border-color:var(--pink);color:var(--pink)}
.mhero .k{color:var(--mut);font-weight:700;font-size:12.5px;letter-spacing:2px;text-transform:uppercase}
.mhero h1{font-size:36px;margin:8px 0;font-weight:800;position:relative;z-index:1}
.mhero p{color:#cfc3e0;font-size:16px;max-width:62ch;line-height:1.55;margin:0;position:relative;z-index:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 28px;margin:22px 0}
.panel h3.t{margin:0 0 16px;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;color:var(--pink);font-weight:700}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rc{border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;background:var(--card2)}
.rc .ico{font-size:26px}.rc h4{margin:8px 0 10px;font-size:15px}
.rc audio,.rc video{width:100%;margin-top:4px}
.rc .fallback{display:none;font-size:12.5px;color:var(--mut);font-style:italic}
.rc .dl{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--grad);padding:10px 20px;border-radius:9px;text-decoration:none}
.content h2{font-size:20px;margin:24px 0 8px}
.content p{line-height:1.75;font-size:15.5px;color:#d8cee8;margin:0 0 14px}
.content strong{color:#fff}
.quote{border-left:3px solid var(--pink);background:var(--card2);padding:14px 20px;border-radius:0 12px 12px 0;font-style:italic;color:#efe3f7;margin:18px 0;font-size:16px}
.q{margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}.q:last-child{border-bottom:none}
.qt{font-weight:600;margin-bottom:10px}
.opt{display:block;padding:12px 15px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:9px;cursor:pointer;font-size:14.5px;transition:.12s;background:var(--card2)}
.opt:hover{border-color:var(--purple)}
.opt.sel{border-color:var(--pink);background:rgba(236,46,142,.10)}
.opt.correct{border-color:var(--ok);background:rgba(57,217,138,.12)}
.opt.wrong{border-color:#e0466b;background:rgba(224,70,107,.12)}
.exp{font-size:13.5px;color:var(--mut);margin-top:6px;display:none}.exp.show{display:block}
.btn{background:var(--grad);color:#fff;border:none;padding:12px 26px;border-radius:11px;font-size:15px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pink);border:1.5px solid var(--pink)}
.score{display:none;margin-top:16px;padding:16px 20px;border-radius:12px;background:var(--card2);font-size:16px}
.score.show{display:block}.score b{color:var(--pink)}
.pager{display:flex;justify-content:space-between;margin:26px 0 60px;gap:12px}
.pager a{cursor:pointer;font-weight:600;color:var(--tx);font-size:14px;text-decoration:none;padding:12px 18px;border:1.5px solid var(--line);border-radius:11px}
.pager a:hover{border-color:var(--pink)}.pager a.disabled{opacity:.35;pointer-events:none}
.pan{padding:34px 0 6px}
.pan .hi{font-size:13px;color:var(--mut);font-weight:600;letter-spacing:.3px}
.pan h1{font-size:clamp(26px,4vw,38px);margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
.pan .role{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:4px 11px;border-radius:99px;background:#241736;border:1px solid #3A2A52;color:#C9B8E0;margin-bottom:16px}
.cont{background:linear-gradient(135deg,#4733A6,#8E2E9E 52%,#EC2E8E);border-radius:20px;padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;box-shadow:0 16px 40px rgba(142,46,158,.26);margin:0 0 26px}
.cont .l{flex:1;min-width:230px}
.cont .k2{font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.82)}
.cont h3{color:#fff;font-size:20px;margin:5px 0 4px;font-weight:800}
.cont p{color:rgba(255,255,255,.86);font-size:13.5px;margin:0}
.cont button{background:#fff;color:#3B1E5E;border:none;font-weight:800;font-size:15px;padding:14px 26px;border-radius:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.cont button:hover{transform:translateY(-1px)}
.rutas{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:0 0 26px}
.ruta{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px;text-decoration:none;display:block;transition:.18s;position:relative;overflow:hidden}
.ruta:hover{transform:translateY(-3px);border-color:#8E2E9E}
.ruta.done{border-color:#39d98a}
.ruta .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.ruta .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px}
.ruta .pill{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:3px 9px;border-radius:99px}
.ruta h4{font-size:16px;margin:0 0 3px;color:var(--tx);font-weight:800}
.ruta .d{font-size:12.5px;color:var(--mut);margin:0 0 14px;line-height:1.45;min-height:36px}
.ruta .pr{display:flex;align-items:center;gap:9px}
.ruta .pb{flex:1;height:7px;background:#241736;border-radius:99px;overflow:hidden}
.ruta .pb i{display:block;height:100%;border-radius:99px;transition:width .5s}
.ruta .pn{font-size:12px;color:var(--mut);font-weight:700;white-space:nowrap}
.logro{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 20px;margin:0 0 10px}
.logro.on{border-color:#39d98a;background:#12281d}
.logro .e{font-size:24px;filter:grayscale(1);opacity:.4}
.logro.on .e{filter:none;opacity:1}
.logro b{display:block;font-size:14px;color:var(--tx)}
.logro span{font-size:12px;color:var(--mut)}
@media(max-width:640px){.cont{padding:22px}.cont button{width:100%}.ruta .d{min-height:0}}
.mapwrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.mapwrap svg{width:100%;height:auto}
.mapnode{cursor:pointer;transition:transform .15s;transform-box:fill-box;transform-origin:center}
.mapnode:hover{transform:translateY(-4px)}.mapnode:hover rect{stroke:var(--pink);stroke-width:2.5}
.mapnode:focus{outline:none}.mapnode:focus rect{stroke:var(--pink);stroke-width:3}
.maphint{font-size:12.5px;color:var(--mut);margin:10px 0 0;text-align:center}
footer{border-top:1px solid var(--line);padding:30px 0;font-size:13px;text-align:center;color:var(--mut)}
footer .fb{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
footer .fb .mk{width:30px;height:19px}
footer a{color:var(--pink);text-decoration:none;margin:0 8px}
/* cert */
#cert .certcard{background:#fff;color:#221030;border-radius:16px;max-width:820px;margin:0 auto;padding:8px}
#cert .cinner{border:2px solid #EC2E8E;border-radius:12px;padding:40px 34px;text-align:center}
#cert .cmk{width:70px;height:44px;margin:0 auto 8px;display:block}
#cert .clabel{letter-spacing:4px;text-transform:uppercase;font-weight:700;font-size:13px}
#cert h2{font-size:30px;margin:10px 0 4px;color:#2a1240}
#cert .cname{font-size:34px;font-weight:800;color:#2a1240;border-bottom:2px solid #f3d6e8;display:inline-block;padding:6px 30px;margin:14px 0}
#cert p{font-size:15px;line-height:1.6;max-width:60ch;margin:8px auto;color:#4a3560}
#cert .cmods{color:#7a6690;font-size:12.5px;margin-top:14px}
.nameinput{padding:12px 15px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;width:340px;max-width:100%;background:var(--card2);color:var(--tx)}
/* --- Mobile: dedos, no mouse --- */
*{-webkit-tap-highlight-color:transparent}
@media(max-width:640px){
 .wrap{padding-left:18px;padding-right:18px}
 /* Tarjetas de modulo: mas aire y target grande */
 .mcard{padding:20px 18px}
 .mcard h3{font-size:17px}
 .mcard p{font-size:14px}
 .mcard .num{width:42px;height:42px}
 .mcard:active{transform:scale(.985)}
 /* Tarjetas de ruta */
 .ruta{padding:20px 18px}
 .ruta:active{transform:scale(.985);border-color:#8E2E9E}
 /* Continuar / botones primarios: ancho completo, altos */
 .rb{width:100%;padding:15px 20px;font-size:16px;border-radius:12px}
 .btn{width:100%;padding:15px 22px;font-size:16px}
 .btn.ghost{width:100%}
 .cont{padding:20px}
 .cont button{width:100%;padding:16px;font-size:16px}
 /* Volver: mas grande y comodo */
 .back{padding:13px 20px;font-size:15px}
 .back:active{border-color:var(--pink)}
 /* Quiz: opciones grandes y separadas, faciles de acertar */
 .opt{padding:16px 16px;font-size:15.5px;margin-bottom:12px;line-height:1.4}
 .opt:active{border-color:var(--pink)}
 .q{margin-bottom:24px;padding-bottom:20px}
 .qt{font-size:15.5px;line-height:1.45}
 /* Texto de leccion mas legible */
 .lesson p,.mbody p{font-size:15.5px;line-height:1.7}
 .lesson h2,.mbody h2{font-size:19px}
 .quote{font-size:15px;line-height:1.5;padding:14px 16px}
 /* Titulos del panel personal */
 .pan h1{font-size:30px}
 h2.sec{font-size:24px}
 /* Drawer: links bien altos */
 .drawer a{padding:17px 22px;font-size:16px}
 .burger{padding:10px}
 /* Recursos / listas con buen tap */
 .rc{padding:16px 18px}
 .rc:active{border-color:var(--pink)}
 /* Botones LinkedIn y compartir a ancho completo */
 .libtn,.share,.certcta button{width:100%!important;padding:15px!important;font-size:15px!important}
}
@media print{header.top,footer,.noprint{display:none!important}body{background:#fff}}
@media(max-width:860px){.grid,.res{grid-template-columns:1fr}nav.desk{display:none}.userbox{display:none}.burger{display:flex}.hero h1{font-size:40px}.hero{padding:64px 0 68px}h2.sec{font-size:26px}}
.resume{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin:0 0 20px;flex-wrap:wrap}
.resume b{color:var(--tx)} .resume .rb{background:var(--grad);color:#fff;border:none;padding:10px 20px;border-radius:9px;font-weight:700;cursor:pointer}
.resume a{color:var(--mut);font-size:12px;cursor:pointer;text-decoration:underline;margin-left:10px}
.onb{position:fixed;inset:0;background:rgba(6,3,10,.78);backdrop-filter:blur(6px);z-index:100;display:none;align-items:center;justify-content:center;padding:22px}
.onb.show{display:flex}
.onb .box{background:var(--card);border:1px solid var(--line);border-radius:22px;max-width:460px;padding:34px 32px;text-align:center;animation:pop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.onb .mk{width:74px;height:46px;margin:0 auto 12px;display:block}
.onb h3{font-size:23px;margin:0 0 8px;font-weight:800}
.onb p{color:var(--mut);font-size:14.5px;line-height:1.6;margin:0 0 18px}
.onb .li{text-align:left;font-size:14px;color:#d8cee8;margin:9px 0;padding-left:26px;position:relative}
.onb .li:before{content:"\2713";position:absolute;left:0;color:var(--pink);font-weight:800}
.onb button{background:var(--grad);color:#fff;border:none;padding:13px 32px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;margin-top:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,70px);background:var(--card);border:1px solid var(--line);color:var(--tx);padding:13px 22px;border-radius:12px;font-weight:600;font-size:14px;z-index:120;opacity:0;transition:.35s cubic-bezier(.2,.8,.2,1);box-shadow:0 12px 30px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0);opacity:1}
/* recursos */
.res{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))!important}
.rc{text-align:left}
.rc.big{grid-column:1/-1}
.rc .rh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rc .rh h4{margin:0;font-size:15px}
.rc .rh .ico{font-size:22px}
.rc .player{width:100%;border-radius:12px;background:#000;display:block}
.vid{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.aud{width:100%;height:90px;border:0;border-radius:12px;background:#120b1c}
.aud.sc{height:120px}.aud.sp{height:152px}
.content ul,.content ol{color:#d8cee8;line-height:1.75;font-size:15.5px;padding-left:22px;margin:0 0 14px}

<script>
const MARK=`<svg style="width:100%;height:100%;display:block" viewBox="0 0 128 74" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="hg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4733A6"/><stop offset="0.45" stop-color="#8E2E9E"/><stop offset="1" stop-color="#EC2E8E"/></linearGradient></defs><path fill="url(#hg)" d="M6 66 L40 18 L40 9 L48 9 L48 15 L50 12 Q53 8 56 13 L62 24 Q84 52 124 44 Q98 41 68 31 Q60 28 55 34 L34 66 Z"/></svg>`;
const STORE={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let scores=STORE.get('ha_s',{}), uname=STORE.get('ha_name',''), uemail=STORE.get('ha_email','');

/* ---------- Contenido: lo carga el Estudio de contenidos; esto es lo que hay en el equipo mientras tanto ---------- */
let CONT=HA_contenidoInicial();
let MODULES=CONT.modulos, CAP=CONT.caso;
const ids=()=>MODULES.map(m=>m.n);
const pos=n=>MODULES.findIndex(m=>m.n===n)+1;
const done=n=>scores[n]!=null&&scores[n]>=60;
const allDone=()=>MODULES.length>0&&ids().every(done);
const nCompl=()=>ids().filter(done).length;
let vista='home';
window.HA_aplicarContenido=function(c){
  if(!c||!c.modulos||!c.modulos.length)return;
  CONT=c; MODULES=c.modulos; CAP=c.caso;
  if(typeof renderUserbox==='function')renderUserbox();
  if(vista==='home')home();
};

const app=document.getElementById('app');
function toggleMenu(){document.getElementById('drawer').classList.toggle('open');document.getElementById('burger').classList.toggle('x');}
function closeMenu(){document.getElementById('drawer').classList.remove('open');document.getElementById('burger').classList.remove('x');}
function observeReveal(){const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');o.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.reveal').forEach(el=>o.observe(el));}
function esc2(x){ return (''+(x==null?'':x)).replace(/[<>&"]/g,c=>c==='<'?'&lt;':c==='>'?'&gt;':c==='&'?'&amp;':'&quot;'); }
function cap1(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ---------- Entorno personal ---------- */
function _sc(k){ try{ return STORE.get(k,{})||{}; }catch(e){ return {}; } }
function _hechos(sc,lista){ return lista.filter(n=>sc[n]!=null&&sc[n]>=60).length; }
function _rutas(){
  const nx=window.HA_nexo||_sc('hn_s'), cq=window.HA_cutaquig||_sc('cq_s');
  return [
   {id:'academy', t:'Humana Academy', d:'La doctrina: cómo observamos, comprendemos y acompañamos al paciente.',
    ic:'🎓', col:'#8E2E9E', bg:'#241736', tot:MODULES.length, hechos:nCompl(), ir:"scrollMods()"},
   {id:'nexo', t:'Humana Nexo', d:'El Programa de Asistencia al Paciente: qué es, cómo funciona y tu rol.',
    ic:'🤝', col:'#14B8A6', bg:'#0F2E2A', tot:5, hechos:_hechos(nx,[1,2,3,4,5]), ir:"location.href='nexo.html'"},
   {id:'cutaquig', t:'Cutaquig®', d:'Capacitación de producto: inmunoglobulina subcutánea, técnica y seguridad.',
    ic:'💉', col:'#0EA5E9', bg:'#0C2237', tot:9, hechos:_hechos(cq,[1,2,3,4,5,6,7,8,9]), ir:"location.href='cutaquig.html'"}
  ];
}
function _siguiente(){
  const r=_rutas().find(x=>x.hechos<x.tot)||null;
  if(!r) return null;
  if(r.id==='academy'){ const m=MODULES.find(x=>!done(x.n)); return {r, n:pos(m.n), t:m.t, ir:`openM(${m.n})`}; }
  return {r, n:r.hechos+1, t:r.t, ir:r.ir};
}
function panelHTML(){
  const nom=(uname||'').split(' ')[0]||'';
  const rs=_rutas();
  const tot=rs.reduce((a,x)=>a+x.tot,0), hec=rs.reduce((a,x)=>a+x.hechos,0);
  const sig=_siguiente();
  const cont = sig
   ? `<div class="cont reveal"><div class="l"><div class="k2">${hec===0?'Empezá por acá':'Seguí donde dejaste'}</div>
      <h3>${sig.r.id==='academy'?`Módulo ${sig.n} · ${esc2(sig.t)}`:esc2(sig.r.t)}</h3>
      <p>${sig.r.id==='academy'?esc2(sig.r.t):`Te faltan ${sig.r.tot-sig.r.hechos} de ${sig.r.tot}`}</p></div>
      <button onclick="${sig.ir}">${hec===0?'Empezar':'Continuar'} →</button></div>`
   : `<div class="cont reveal"><div class="l"><div class="k2">Completaste todo</div>
      <h3>No te queda nada pendiente</h3><p>Descargá tus certificados o repasá lo que quieras.</p></div>
      <button onclick="openCert()">Ver certificado →</button></div>`;
  const cards = rs.map(function(r){
    const pct=r.tot?Math.round(r.hechos/r.tot*100):0, fin=r.tot>0&&r.hechos>=r.tot;
    const pill = fin ? `<span class="pill" style="background:#39d98a;color:#08240f">Completado</span>`
      : r.hechos>0 ? `<span class="pill" style="background:${r.bg};color:${r.col}">En curso</span>`
      : `<span class="pill" style="background:#241736;color:#9E90B5">Sin empezar</span>`;
    return `<a class="ruta reveal ${fin?'done':''}" onclick="${r.ir}" tabindex="0" style="cursor:pointer">
      <div class="top"><span class="ic" style="background:${r.bg}">${r.ic}</span>${pill}</div>
      <h4>${r.t}</h4><p class="d">${r.d}</p>
      <div class="pr"><div class="pb"><i style="width:${pct}%;background:${r.col}"></i></div><span class="pn">${r.hechos}/${r.tot}</span></div></a>`;
  }).join('');
  const cert=allDone();
  const logros = `
    <div class="logro ${hec>0?'on':''}"><span class="e">🚀</span><div><b>Arrancaste</b><span>Completaste tu primer módulo</span></div></div>
    <div class="logro ${cert?'on':''}"><span class="e">🎓</span><div><b>Certificado de Academy</b><span>${cert?'Ya podés descargarlo':`Se habilita al aprobar los ${MODULES.length} módulos`}</span></div></div>
    <div class="logro ${hec>=tot?'on':''}"><span class="e">🏆</span><div><b>Recorrido completo</b><span>${hec>=tot?'Terminaste las tres rutas':`${hec} de ${tot} módulos en total`}</span></div></div>`;
  return `<section class="pan"><div class="wrap">
   <div class="hi reveal">${nom?`Hola, ${esc2(nom)}`:'Hola'}</div>
   <h1 class="reveal">Tu <span class="grad">formación</span></h1>
   ${cont}
   <div class="eyebrow grad reveal">Tus rutas</div>
   <h2 class="sec reveal" style="margin-bottom:6px">${rs.length} recorridos, ${tot} módulos</h2>
   <p class="sub reveal">Llevás ${hec} de ${tot} módulos en total.</p>
   <div class="rutas">${cards}<a class="ruta reveal" href="estratificador.html" style="cursor:pointer">
     <div class="top"><span class="ic" style="background:#2A1F0E">📊</span><span class="pill" style="background:#2A1F0E;color:#E0A82E">Herramienta</span></div>
     <h4>Estratificador</h4><p class="d">Herramienta comercial para dimensionar oportunidades con financiadores e instituciones.</p>
     <div class="pr"><span class="pn">Abrir →</span></div></a></div>
   <div class="eyebrow grad reveal">Tus logros</div>
   <h2 class="sec reveal" style="margin-bottom:14px">Lo que ya conseguiste</h2>
   ${logros}
  </div></section>`;
}

/* ---------- Mapa del programa: se arma solo con los módulos publicados ---------- */
function _partir(t,max){ const w=(t||'').split(' '); const l=['']; w.forEach(x=>{ const c=l[l.length-1]; if((c+' '+x).trim().length>max&&l.length<2&&c)l.push(x); else l[l.length-1]=(c+' '+x).trim(); }); if(l.length===2&&l[1].length>max+4)l[1]=l[1].slice(0,max+2)+'…'; return l; }
function mapaHTML(){
  const N=MODULES.length; if(!N) return '';
  const G=N<=6?[1000,570,286,192,234,22]:N<=8?[1000,660,340,250,220,21]:[1100,800,430,320,205,20];
  const W=G[0], H=G[1], cx=W/2, cy=H/2, rx=G[2], ry=G[3], bw=G[4], bh=70, mx=G[5];
  let lines='', nodes='';
  MODULES.forEach((m,i)=>{
    const a=-Math.PI/2+i*2*Math.PI/N, x=cx+rx*Math.cos(a), y=cy+ry*Math.sin(a);
    const bx=Math.max(8,Math.min(W-bw-8,x-bw/2)), by=y-bh/2;
    const tl=_partir(m.t,mx), ok=done(m.n);
    lines+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#3A2A52" stroke-width="2.5"/>`;
    nodes+=`<g class="mapnode" onclick="openM(${m.n})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openM(${m.n})}" role="link" tabindex="0" aria-label="Módulo ${i+1}"><rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw}" height="${bh}" rx="15" fill="#1E1430" stroke="${ok?'#39d98a':'#3A2A52'}" stroke-width="1.5"/><circle cx="${(bx+27).toFixed(1)}" cy="${y.toFixed(1)}" r="15" fill="${ok?'#39d98a':'url(#mg)'}"/><text x="${(bx+27).toFixed(1)}" y="${(y+5).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="700" fill="${ok?'#08240f':'#fff'}">${i+1}</text>`
      +tl.map((s,k)=>`<text x="${(bx+50).toFixed(1)}" y="${(y-(tl.length>1?9:3)+k*18).toFixed(1)}" font-size="${N>8?13.5:14}" font-weight="700" fill="#EDE6F5">${esc2(s)}</text>`).join('')
      +`<text x="${(bx+50).toFixed(1)}" y="${(y+(tl.length>1?26:16)).toFixed(1)}" font-size="11.5" font-style="italic" fill="#9E90B5">${esc2((m.etiqueta||'').length>28?(m.etiqueta.slice(0,27)+'…'):(m.etiqueta||''))}</text></g>`;
  });
  const svg=`<svg style="width:100%;height:auto;display:block" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Inter,Arial,sans-serif" role="img" aria-label="Mapa del programa"><defs><linearGradient id="mg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#4733A6"/><stop offset="0.5" stop-color="#8E2E9E"/><stop offset="1" stop-color="#EC2E8E"/></linearGradient></defs>${lines}${nodes}<rect x="${cx-108}" y="${cy-36}" width="216" height="72" rx="18" fill="url(#mg)"/><text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Medicina de</text><text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">Continuidad</text></svg>`;
  const lista=`<ul class="mapl">${MODULES.map((m,i)=>`<li class="${done(m.n)?'ok':''}" onclick="openM(${m.n})"><span class="c">${done(m.n)?'✓':i+1}</span><div><b>${esc2(m.t)}</b><span>${esc2(m.etiqueta||'')}</span></div></li>`).join('')}</ul>`;
  return `<div class="mapwrap reveal">${svg}${lista}<p class="maphint">Tocá un módulo para entrar.</p></div>`;
}

function home(){vista='home';renderUserbox();
 const N=MODULES.length, compl=nCompl(), pct=N?Math.round(compl/N*100):0;
 let cards=MODULES.map((m,i)=>`<div class="mcard reveal ${done(m.n)?'v':''}" style="transition-delay:${i*40}ms" tabindex="0" onclick="openM(${m.n})" onkeydown="if(event.key==='Enter')openM(${m.n})"><div class="num">${i+1}</div><span class="done">✓</span><h3>${esc2(m.t)}</h3><p>${esc2(m.lead)}</p>${done(m.n)?`<div class="best">Completado · mejor ${scores[m.n]}%</div>`:''}<span class="go grad">Abrir módulo →</span></div>`).join('');
 if(CAP) cards+=`<div class="mcard cap reveal" tabindex="0" onclick="openCap()" onkeydown="if(event.key==='Enter')openCap()"><div class="num">★</div><h3>${esc2(CAP.t)}</h3><p>${esc2(CAP.lead)}</p><span class="go grad">Abrir caso →</span></div>`;
 const next=MODULES.find(m=>!done(m.n));
 const resume=(compl>0&&next)?`<div class="resume reveal"><div>Continuá donde quedaste — <b>Módulo ${pos(next.n)}: ${esc2(next.t)}</b></div><div><button class="rb" onclick="openM(${next.n})">Continuar</button></div></div>`:'';
 const cert=allDone()?`<div class="certcta reveal"><div><b>¡Completaste los ${N} módulos!</b><br><small>Descargá tu certificado.</small></div><button onclick="openCert()">Ver certificado</button></div>`:'';
 app.innerHTML=`
 ${panelHTML()}
 <section class="blk" id="mods"><div class="wrap">
  <div class="eyebrow grad reveal">El programa</div><h2 class="sec reveal">${cap1(HA_enLetras(N))} módulos, una idea por módulo</h2>
  <p class="sub reveal">Cada módulo combina una lectura breve, recursos de apoyo y una autoevaluación. Se completa al aprobar la autoevaluación con 60% o más.</p>
  ${resume}${cert}
  <div class="prog reveal"><span>${compl}/${N} completados ${compl>=N&&N?'🥇':compl>=N/2?'🥉':''}</span><div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="grid">${cards}</div></div></section>
 <section class="blk" style="padding-top:0"><div class="wrap"><a href="nexo.html" style="display:block;text-decoration:none;background:linear-gradient(135deg,#0F766E,#14B8A6 55%,#2DD4BF);border-radius:20px;padding:28px 30px;position:relative;overflow:hidden;box-shadow:0 16px 40px rgba(20,184,166,.22)"><div style="font-size:11.5px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:#06231d;opacity:.85">Track · Programa de Asistencia al Paciente</div><h2 style="margin:6px 0 6px;font-size:26px;font-weight:800;color:#04140f">Humana Nexo</h2><p style="margin:0;max-width:640px;color:#06231d;font-weight:600;font-size:15px">Una formación aparte, con su propio entorno y certificado: cómo acompañamos terapias especiales de principio a fin. &nbsp;<span style="text-decoration:underline">Entrar →</span></p></a></div></section>
 <section class="blk" style="padding-top:0"><div class="wrap"><div class="eyebrow grad reveal">Vista general</div><h2 class="sec reveal">El mapa del programa</h2>
  <p class="sub reveal">Toda la Medicina de Continuidad en un vistazo.</p>
  ${mapaHTML()}</div></section>`;
 window.scrollTo(0,0);observeReveal();
}
function scrollMods(){const e=document.getElementById('mods');if(e)e.scrollIntoView();else{home();setTimeout(()=>{const x=document.getElementById('mods');if(x)x.scrollIntoView();},60);}}
function renderModule(m,isCap){
 if(!m){home();return;}
 vista=isCap?'cap':'mod';
 const i=isCap?-1:MODULES.indexOf(m), prev=isCap?null:MODULES[i-1], next=isCap?null:MODULES[i+1];
 const res=HA_recursosPanel(m.recursos);
 const pager=isCap?`<div class="pager"><a onclick="home()">← Inicio</a><a onclick="home()">Inicio →</a></div>`:`<div class="pager"><a class="${prev?'':'disabled'}" onclick="${prev?`openM(${prev.n})`:''}">← ${prev?('Módulo '+i):'Inicio'}</a><a onclick="${next?`openM(${next.n})`:(CAP?'openCap()':'home()')}">${next?('Módulo '+(i+2)):(CAP?'Caso integrador':'Volver')} →</a></div>`;
 const hayQuiz=(m.quiz||[]).length>0;
 app.innerHTML=`<section class="mhero"><div class="blob b2"></div><div class="wrap"><a class="back" onclick="home()">← Volver a los módulos</a>
  <div class="k">${isCap?'Caso integrador':'Módulo '+(i+1)}</div><h1>${esc2(m.t)}</h1><p>${esc2(m.lead)}</p></div></section>
  <div class="wrap">${res}
  <div class="panel content"><h3 class="t">${isCap?'El caso':'Contenido'}</h3>${m.body||''}</div>
  ${hayQuiz?`<div class="panel"><h3 class="t">Autoevaluación</h3><div id="quiz"></div>
  <div style="margin-top:8px"><button class="btn" onclick="grade('${isCap?'cap':m.n}')">Corregir</button> <button class="btn ghost" onclick="${isCap?'openCap()':'openM('+m.n+')'}">Reiniciar</button></div>
  <div class="score" id="score"></div></div>`:''}${pager}</div>`;
 if(hayQuiz)renderQuiz(m);window.scrollTo(0,0);
}
function openM(n){STORE.set('ha_last',n);renderModule(MODULES.find(x=>x.n===n),false);}
function openCap(){renderModule(CAP,true);}
let answers={},curQuiz=null;
function renderQuiz(m){answers={};curQuiz=m;document.getElementById('quiz').innerHTML=m.quiz.map((q,qi)=>`<div class="q"><div class="qt">${qi+1}. ${esc2(q.q)}</div>${q.o.map((o,oi)=>`<label class="opt" id="o_${qi}_${oi}" onclick="pick(${qi},${oi})">${esc2(o)}</label>`).join('')}${q.e?`<div class="exp" id="e_${qi}">✔ ${esc2(q.e)}</div>`:`<div class="exp" id="e_${qi}"></div>`}</div>`).join('');}
function pick(qi,oi){answers[qi]=oi;const q=curQuiz.quiz[qi];q.o.forEach((_,i)=>{const e=document.getElementById('o_'+qi+'_'+i);if(e)e.classList.remove('sel');});document.getElementById('o_'+qi+'_'+oi).classList.add('sel');}
function grade(id){const m=curQuiz;
 const faltan=m.quiz.filter((q,qi)=>answers[qi]==null).length;
 if(faltan&&!confirm(faltan===1?'Te falta responder una pregunta. ¿Corregir igual?':'Te faltan '+faltan+' preguntas. ¿Corregir igual?'))return;
 let ok=0;m.quiz.forEach((q,qi)=>{q.o.forEach((_,oi)=>{const el=document.getElementById('o_'+qi+'_'+oi);el.classList.remove('sel');el.style.pointerEvents='none';if(oi===q.c)el.classList.add('correct');else if(answers[qi]===oi)el.classList.add('wrong');});if(answers[qi]===q.c)ok++;document.getElementById('e_'+qi).classList.add('show');});
 const pct=Math.round(ok/m.quiz.length*100);if(id!=='cap'){const n=+id;const prev=scores[n];if(scores[n]==null||pct>scores[n]){scores[n]=pct;STORE.set('ha_s',scores);}if(pct>=60&&(prev==null||prev<60)){if(window.motivComplete){window.motivComplete(scores);}else{toast('¡Módulo completado! ✓');}}renderUserbox();if(window.HA_sync)window.HA_sync(scores);}
 const s=document.getElementById('score');s.classList.add('show');
 const msg=pct>=60?(pct===100?'Excelente, dominás la idea.':'Aprobado. Módulo completado.'):'Todavía no llegás al 60%. Repasá y volvé a intentar.';

function toast(m){const t=document.getElementById('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600);}
function confetti(){const c=document.createElement('canvas');c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:130';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d');const cols=['#4733A6','#8E2E9E','#EC2E8E','#F0328C','#ffffff'];let P=[];for(let i=0;i<150;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.3,r:4+Math.random()*5,c:cols[i%cols.length],vy:2+Math.random()*3.5,vx:-1.2+Math.random()*2.4,a:Math.random()*6});let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.vy;p.x+=p.vx;p.a+=.12;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore();});f++;if(f<150)requestAnimationFrame(loop);else c.remove();})();}
